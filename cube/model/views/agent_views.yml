# 給 AI Agent 與外部工具用的查詢入口。
#
# 為什麼要有 view：cube 之間不是每一對都能 join（participants 與 teammates 都接到 matches，
# 但彼此沒有路徑，硬查會出現 "Can't find join path"），而且查「我」的數字一定要鎖定玩家。
# 這些規則原本要靠查詢的人自己記。每個 view 只收「能一起查」的欄位，並附上鎖定本機帳號
# 與 Mayhem 模式的 segment，照著 view 查就不會組出錯的查詢。
#
# 網站前端不用這些 view（前端直接查 cube，自由探索頁也會把 view 濾掉），改這裡不影響畫面。
views:
  - name: my_performance
    title: 我的對局表現
    description: >
      每位玩家每場的表現，可依英雄、定位、增幅、裝備、時間、對局長度分組。
      問「我」的數字請加 segment mine（只看本機帳號），只看 Mayhem 請加 segment mayhem。
      不加 mine 也不指定 riot_id 的話，會得到所有已收錄玩家的玩家對局數；不可把它當成單一玩家勝率。
      games/wins/losses 是玩家對局粒度；match_count 才是不重複的遊戲對局數。
      問陣容（comp_context 的 team_*／enemy_*）的勝率用 lineup_games／lineup_wins／lineup_winrate：以（對局, 隊伍）去重，
      多人視角下同一隊不會被算五次。
      以 augment 或 item 分組時一場會出現在多列底下，玩家對局數與勝率仍以 distinct 玩家對局列計算。
      participant_context 提供前一場結果、休息與 session 階段；team_context 提供我方／敵方隊伍差距與首塔等終場資訊。
      best_* 是單場紀錄（max：範圍內每分鐘數值最高的那一場），和同名的平均指標（dpm、gpm…）算式相同；
      要知道是哪一場，用 participant_key 分組再依同一個 best_* 排序。
      只要「某個帳號也在場」的對局，用 co_player_puuid／co_player 篩（只能篩，不能分組：一對多，一場十列）。
      按天分組用 local_date；用 played_at 篩日期區間時查詢要帶 "timezone": "Asia/Taipei"。
    cubes:
      - join_path: participants
        includes:
          - mine
          - wins_only
          - losses_only
          - carried
          - tanked
          - fed
          - had_multikill
          - riot_id
          # 某一場的某一位參賽者。要問「最好的那一場是哪一場」時，用它分組再依 best_* 排序：
          # 一組只有一列，max 就等於該場的值
          - participant_key
          - team_side
          - party_size
          - result
          - champ_level
          - death_bucket
          - spell_1
          - spell_2
          - spell_pair
          - damage_profile
          - augment_count
          - games
          - wins
          - losses
          - match_count
          - winrate
          # team_context 的 games／wins／winrate 在這個 view 已經叫 team_*，這三個改名避開
          - name: team_games
            alias: lineup_games
          - name: team_wins
            alias: lineup_wins
          - name: team_winrate
            alias: lineup_winrate
          - deaths_per_10min
          - taken_per_min
          - mitigated_per_min
          - heal_per_min
          - cc_time_per_min
          - cs_per_min
          - physical_damage_share
          - magic_damage_share
          - true_damage_share
          - taken_true_share
          - gold_share
          - objective_damage_per_min
          - first_tower_kill_rate
          - avg_kills
          - avg_deaths
          - avg_assists
          - kda
          - kill_participation
          - multikills
          - pentas
          - multikill_rate
          - first_blood_rate
          - avg_damage
          - dpm
          - damage_share
          - damage_per_gold
          - avg_objective_damage
          - avg_taken
          - tank_share
          - avg_mitigated
          - avg_heal
          - avg_survival
          - taken_physical_share
          - taken_magic_share
          - champion_damage_focus
          - avg_cc
          - avg_largest_spree
          - avg_turret_kills
          - avg_time_dead
          - time_dead_share
          - time_dead_games
          - total_turret_kills
          - avg_inhibitor_kills
          - objective_damage_share
          - avg_minion_damage
          - minion_damage_per_min
          - best_crit
          # 單場紀錄：每分鐘數值最高的那一場（max，不是平均）
          - best_kills_per_min
          - best_deaths_per_min
          - best_assists_per_min
          - best_dpm
          - best_taken_per_min
          - best_mitigated_per_min
          - best_heal_per_min
          - best_cc_time_per_min
          - best_gpm
          - best_cs_per_min
          - best_objective_damage_per_min
          - best_minion_damage_per_min
          - avg_units_healed
          - avg_gold
          - gpm
          - avg_cs
          - unspent_gold
          - avg_team_dmg
          - avg_enemy_dmg
          - dmg_gap
          - avg_team_gold
          - avg_enemy_gold
          - gold_gap
          - avg_team_kills
          - avg_enemy_kills
          - kill_gap
          - team_dpm
          - enemy_dpm
          - dpm_gap
          - team_gpm
          - enemy_gpm
          - gpm_gap

      - join_path: participants.matches
        includes:
          - mayhem
          - queue_id
          - patch
          - played_at
          - local_date
          - weekday
          - hour_of_day
          - duration_bucket
          - ended_surrender
          - end_type
          - time_block
          - is_weekend
          - avg_duration

      - join_path: participants.participant_context
        includes:
          - prev_result
          - break_minutes_before
          - break_bucket
          - game_in_session
          - session_stage
          - minutes_before
          - avg_break_minutes
          - avg_minutes_before

      - join_path: participants.team_context
        includes:
          - side
          - name: result
            alias: team_result
          - name: duration_bucket
            alias: team_duration_bucket
          - first_blood
          - first_tower
          - first_inhibitor
          - name: games
            alias: team_games
          - name: wins
            alias: team_wins
          - name: winrate
            alias: team_winrate
          - name: avg_team_kills
            alias: team_avg_kills
          - name: avg_enemy_kills
            alias: team_avg_enemy_kills
          - name: kill_gap
            alias: team_kill_gap
          - name: avg_team_dmg
            alias: team_avg_dmg
          - name: avg_enemy_dmg
            alias: team_avg_enemy_dmg
          - name: dmg_gap
            alias: team_dmg_gap
          - name: team_dpm
            alias: team_team_dpm
          - name: enemy_dpm
            alias: team_enemy_dpm
          - name: dpm_gap
            alias: team_dpm_gap
          - name: avg_team_gold
            alias: team_avg_gold
          - name: avg_enemy_gold
            alias: team_avg_enemy_gold
          - name: gold_gap
            alias: team_gold_gap
          - name: team_gpm
            alias: team_team_gpm
          - name: enemy_gpm
            alias: team_enemy_gpm
          - name: gpm_gap
            alias: team_gpm_gap
          - name: avg_tower_kills
            alias: team_avg_tower_kills
          - name: avg_inhibitor_kills
            alias: team_avg_inhibitor_kills
          - name: first_blood_rate
            alias: team_first_blood_rate
          - name: first_tower_rate
            alias: team_first_tower_rate
          - name: first_inhibitor_rate
            alias: team_first_inhibitor_rate

      - join_path: participants.champions
        includes:
          - name: name
            alias: champion

      - join_path: participants.champion_roles
        includes:
          - name: name
            alias: champion_role
          - name: is_primary
            alias: champion_role_is_primary

      - join_path: participants.builds
        includes:
          - name: build_role
          - name: ad_gold_share
          - name: ap_gold_share
          - name: tank_gold_share
          - name: perf_index
          - name: role_metric

      - join_path: participants.comp_context
        includes:
          - name: ally_frontline
          - name: enemy_frontline
          - name: enemy_damage_type
          - name: ally_damage_type
          - name: team_frontline
          - name: team_damage_mix
          - name: enemy_damage_mix
          - name: team_support
          - name: enemy_support
          - name: team_comp
          - name: enemy_comp
          - name: team_archetype
          - name: enemy_archetype
          - name: team_lineup
          - name: enemy_lineup

      - join_path: participants.contribution
        includes:
          # perf＝當局表現分（這場打得有多好，全隊都打得好可以全隊都高）；score 與 *_pct＝隊內排名（誰在隊裡扛得多）
          - name: perf
            alias: performance_score
          - name: perf_dmg
            alias: performance_damage
          - name: perf_soak
            alias: performance_soak
          - name: perf_surv
            alias: performance_survival
          - name: perf_kp
            alias: performance_kill_participation
          - name: perf_minion
            alias: performance_minion_clear
          - name: perf_obj
            alias: performance_objective
          - name: perf_cc
            alias: performance_cc
          - name: perf_heal
            alias: performance_heal
          - name: score
            alias: contribution_score
          - name: scored_games
            alias: contribution_scored_games
          - name: dmg_pct
            alias: contribution_damage
          - name: soak_pct
            alias: contribution_soak
          - name: surv_pct
            alias: contribution_survival
          - name: kp_pct
            alias: contribution_kill_participation
          - name: cc_pct
            alias: contribution_cc
          - name: heal_pct
            alias: contribution_heal

      # 「某個帳號也在場的那些對局」：加一個 co_player_puuid（或 co_player）等值篩選就好。
      # 只能當篩選用——一對多，拿來分組會讓一場變成十列、平均類指標被重複計算。
      # 要問「和誰同場的勝率」請改用 people_met。
      - join_path: participants.game_players
        includes:
          - name: puuid
            alias: co_player_puuid
          - name: riot_id
            alias: co_player

      - join_path: participants.augments
        includes:
          - name: name
            alias: augment
          - name: rarity
            alias: augment_rarity
          - name: slot
            alias: augment_slot

      - join_path: participants.items
        includes:
          - name: name
            alias: item

  - name: people_met
    title: 同場玩家（隊友與對手）
    description: >
      「某人的某一場 × 同場的另一位玩家」。用來問和誰同隊比較會贏、遇到誰比較會輸。
      一定要加 segment mine（以本機帳號為視角），並用 relation 篩選 teammate（同隊）或 opponent（對手）。
      player 是對方的名稱；my_champion / my_champion_role 是我那場的英雄與定位，other_champion 是對方的英雄。
      這個 view 不能和 my_performance 的欄位混在同一個查詢。
    cubes:
      - join_path: teammates
        includes:
          - mine
          - player
          - relation
          - my_champion
          - other_champion
          - games
          - wins
          - winrate
          - last_played

      - join_path: teammates.matches
        includes:
          - mayhem
          - queue_id
          - patch
          - played_at
          - local_date
          - weekday
          - hour_of_day
          - duration_bucket

      - join_path: teammates.champion_roles
        includes:
          - name: name
            alias: my_champion_role
          - name: is_primary
            alias: my_champion_role_is_primary

  - name: session_rhythm
    title: 連續對局的節奏
    description: >
      依時間排序的對局序列，用來問「輸了之後下一場會不會也輸」「一天打越多場是不是越差」。
      一定要加 segment mine；前一場與當日第幾場都是在同一模式內計算，只看 Mayhem 請加 segment mayhem。
      這個 view 保留日曆日序列；要把休息分鐘、session 階段與 DPM 一起查，請使用 my_performance 的 participant_context 欄位。
    cubes:
      - join_path: my_games
        includes:
          - mine
          - mayhem
          - queue_id
          - played_at
          - prev_result
          - game_of_day
          - session_stage
          - games
          - wins
          - winrate
          - avg_duration

  - name: augment_analysis
    title: 增幅組合分析
    description: >
      以同一位玩家同一場同時擁有的兩個不重複增幅為分析粒度。
      一定要加 segment mine；只看 Mayhem 請再加 segment mayhem。
      pair 是共現配置，不是可選候選池，也不代表因果收益；請同時看場次。
    cubes:
      - join_path: augment_pairs
        includes:
          - mine
          - mayhem
          - pair
          - augment_a
          - augment_b
          - result
          - games
          - wins
          - losses
          - winrate
          - avg_dpm
          - avg_gold
