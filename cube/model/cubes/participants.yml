cubes:
  - name: participants
    title: 對局表現
    # 重開局（matches.is_remake）的參賽紀錄不算。rowid 要原樣帶出來：主鍵與衍生表（mat_*）的 participant_rowid 都是它
    # time_spent_dead（死亡總時間）對局明細沒有，只有賽後統計有（eog_player_stats，主鍵 game_id＋puuid，所以一對一不會多列）；
    # 開始擷取賽後統計之前的場次是空值
    sql: >
      SELECT mp.rowid AS rowid, mp.*, e.time_spent_dead AS time_spent_dead
      FROM match_participants mp
      LEFT JOIN eog_player_stats e ON e.game_id = mp.game_id AND e.puuid = mp.puuid
      WHERE NOT EXISTS (
        SELECT 1 FROM matches rm
        WHERE rm.platform_id = mp.platform_id AND rm.game_id = mp.game_id AND rm.is_remake = 1
      )
    description: >
      主要事實表:每場對局每位玩家一列。以增幅或裝備為維度查詢時一場會展開成多列,
      因此玩家對局類指標用 count_distinct(玩家對局列),真正對局類指標另用 count_distinct(對局鍵)。

    # 快取失效的依據:只有「採集到新對局」或「帳號/追蹤狀態改變」時,
    # 查詢結果才會改變,所以 refresh key 就看這兩樣(外加增幅數量,改版新增增幅時會變)。
    #
    # 沒設的話 Cube 用 FLOOR(UNIX_TIMESTAMP() / 10)——每 10 秒換一次鍵。實測結果是:
    #   - 資料沒變,同一個英雄查詢一天被重跑 44 次,每次背景刷新都佔掉並行度 2 的一個位子
    #   - 查詢在佇列裡等超過 10 秒,鍵就換了,Cube 會把它再跑一次(看過一個請求跑了兩遍、共 27 秒)
    #   - 塞車 -> 鍵過期 -> 重跑 -> 更塞車,是正回饋
    # 所有 cube 都用「一模一樣」的 SQL,Cube 才會把同一時間的檢查合併成一次。
    #
    # 已知漏網:改版只改了名稱、增幅數量不變、又剛好沒有新對局時,舊名稱會
    # 多顯示到下一場入庫為止。只影響顯示,不影響數字。
    #
    # 最後一段是預先算好的衍生表（mat_*，見 features.py）的版本。對局是一場一場 commit 的，
    # 衍生表在整輪採集之後才重建；少了這段，「新對局已寫入、衍生表還沒重建」那一兩秒內
    # 查到的結果（新對局沒有出裝定位）會被當成最新的，一直沿用到下一場入庫。
    refresh_key:
      sql: >
        SELECT (SELECT COALESCE(MAX(ingested_at), 0) FROM matches) || ':' || (SELECT COUNT(*) FROM dim_augments) || ':' || (SELECT group_concat(puuid || is_me || tracked) FROM accounts) || ':' || (SELECT COALESCE(MAX(version), 0) FROM mat_state)

    joins:
      - name: matches
        sql: "{CUBE}.platform_id = {matches}.platform_id AND {CUBE}.game_id = {matches}.game_id"
        relationship: many_to_one

      - name: champions
        sql: "{CUBE}.champion_id = {champions}.id"
        relationship: many_to_one

      - name: champion_roles
        sql: "{CUBE}.champion_id = {champion_roles}.champion_id"
        relationship: one_to_many

      - name: augments
        sql: "{CUBE}.platform_id = {augments}.platform_id AND {CUBE}.game_id = {augments}.game_id AND {CUBE}.participant_id = {augments}.participant_id"
        relationship: one_to_many

      - name: items
        sql: "{CUBE}.platform_id = {items}.platform_id AND {CUBE}.game_id = {items}.game_id AND {CUBE}.participant_id = {items}.participant_id"
        relationship: one_to_many

      # 「這場還有誰」。只拿來篩「某個帳號也在場的對局」（game_players.puuid 等於某人），
      # 一對多：以它的欄位分組時一場會展開成十列。說明與注意事項在 dimensions.yml 的 game_players。
      - name: game_players
        sql: "{CUBE}.platform_id = {game_players}.platform_id AND {CUBE}.game_id = {game_players}.game_id"
        relationship: one_to_many

      - name: participant_context
        sql: "{CUBE}.rowid = {participant_context}.participant_rowid"
        relationship: one_to_one

      # 出裝定位：每位參賽者每場一列，和 participant_context 一樣用 rowid 一對一對回來
      - name: builds
        sql: "{CUBE}.rowid = {builds}.participant_rowid"
        relationship: one_to_one

      # 陣容情境（隊友／敵方前排數、傷害類型），同樣一對一
      - name: comp_context
        sql: "{CUBE}.rowid = {comp_context}.participant_rowid"
        relationship: one_to_one

      # 貢獻分數（各項指標在同類型裡的名次百分位；6 分鐘內的重開局沒有這一列），同樣一對一
      - name: contribution
        sql: "{CUBE}.rowid = {contribution}.participant_rowid"
        relationship: one_to_one

      - name: team_context
        sql: >
          {CUBE}.platform_id = {team_context}.platform_id
          AND {CUBE}.game_id = {team_context}.game_id
          AND {CUBE}.team_id = {team_context}.team_id
        relationship: many_to_one

    # 具名的可重用篩選。定義一次，前端只要送 segment 名稱，
    # 不必自己拼條件——條件的正確性留在模型裡。
    segments:
      # 給 AI Agent 與外部查詢用：不必先查 puuid 就能鎖定本機帳號。
      # 不加任何玩家條件的話，一場 10 個人的數據會混在一起，勝率會接近 50%。
      - name: mine
        title: 只看本機帳號
        description: 只算本機帳號（accounts.is_me = 1）的對局表現。問「我」的數字時一定要加這個，或改用 participants.riot_id 指定玩家。
        sql: "{CUBE}.puuid IN (SELECT puuid FROM accounts WHERE is_me = 1)"

      - name: wins_only
        title: 只看勝場
        sql: "{CUBE}.win = 1"

      - name: losses_only
        title: 只看敗場
        sql: "{CUBE}.win = 0"

      - name: carried
        title: 我是輸出核心
        sql: "{CUBE}.dmg_to_champions * 1.0 / NULLIF({CUBE}.team_dmg, 0) >= 0.28"

      - name: tanked
        title: 我在扛傷害
        sql: "{CUBE}.dmg_taken * 1.0 / NULLIF({CUBE}.game_duration, 0) >= 45"

      - name: fed
        title: 死超過十次
        sql: "{CUBE}.deaths > 10"

      - name: had_multikill
        title: 有拿到多殺
        sql: "{CUBE}.double_kills + {CUBE}.triple_kills + {CUBE}.quadra_kills + {CUBE}.penta_kills > 0"

    # 下鑽路徑的預設組合。自由探索頁的「下鑽路徑」模式直接讀 /meta 裡的 hierarchies，
    # 在這裡加一條，選單就多一條。每一層只能是維度，可以跨到 join 得到的 cube。
    # 以誰為主角（帳號、模式、期間）由前端加篩選，不寫在這裡。
    hierarchies:
      - name: champion_build
        title: 英雄怎麼玩
        levels:
          - champions.name
          - augments.name
          - matches.duration_bucket

      - name: role_champion
        title: 哪種英雄適合我
        levels:
          - champion_roles.name
          - champions.name
          - participants.party_size

      - name: when_champion
        title: 什麼時候玩什麼
        levels:
          - matches.weekday
          - matches.hour_of_day
          - champions.name

      - name: session_context
        title: 連續遊玩情境
        levels:
          - participant_context.prev_result
          - participant_context.session_stage
          - champions.name

      - name: team_context
        title: 個人與隊伍情境
        levels:
          - team_context.result
          - team_context.side
          - champions.name

    dimensions:
      # 用 SQLite 內建的 rowid,不要用三個欄位串接的字串。
      # 以增幅或裝備為維度、又同時要兩個以上指標時,Cube 會產生一段
      # 「把主鍵撈出來再 join 回本表」的 SQL;主鍵若是字串運算式,
      # 那個 join 就用不到任何索引,實測 4156 x 1101 筆要跑 605 毫秒,
      # 換成 rowid 之後是 11 毫秒。rowid 只在單次查詢內用來把列對回自己,
      # 不會被寫進任何地方,所以 VACUUM 之後改變也沒有影響。
      - name: id
        sql: "{CUBE}.rowid"
        type: number
        primary_key: true
        public: false

      - name: game_key
        title: 對局鍵
        sql: "{CUBE}.platform_id || ':' || {CUBE}.game_id"
        type: string
        public: true

      # 公開：對局卡片要標出「這一場的出裝定位」，列表的資料來自 /api/matches，
      # 定位的規則只在語意層有一份，所以前端拿卡片上的這個鍵回頭向 Cube 查（一場一人一列）。
      - name: participant_key
        title: 參賽者鍵
        description: "某一場的某一位參賽者：platform_id:game_id:participant_id。把逐場資料對回語意層的欄位用。"
        sql: "{CUBE}.platform_id || ':' || {CUBE}.game_id || ':' || {CUBE}.participant_id"
        type: string

      # 公開：好友比較頁要「依玩家分組」，名稱（riot_id）會改、也可能撞名，分組鍵只能用 puuid。
      # 和 teammates.puuid 一樣公開；自由探索頁的欄位清單本來就會濾掉 *.puuid（useCubeMeta），不會出現在選單。
      - name: puuid
        title: 玩家 ID
        description: "玩家的 puuid，依玩家分組或篩選用。要顯示名稱請用 riot_id。"
        sql: puuid
        type: string

      - name: riot_id
        title: 玩家
        description: "玩家名稱（Riot ID，採集當下的名稱，改名後舊場次仍是舊名）。包含同場其他玩家。"
        sql: riot_id
        type: string
        meta:
          group: 玩家

      # 刻意用字串而不是數字:Cube 會把篩選值綁成字串,而這是 CASE 運算式、
      # 沒有欄位型別親和性,SQLite 不會把 '1' 轉成 1,比較永遠為假。
      # 真欄位(如 queue_id)有 INTEGER 親和性所以不受影響。
      - name: is_me
        title: 是否為本機帳號
        sql: "CASE WHEN {CUBE}.puuid IN (SELECT puuid FROM accounts WHERE is_me = 1) THEN 'true' ELSE 'false' END"
        type: string
        public: false

      - name: champion_id
        sql: champion_id
        type: number
        public: false

      - name: team_id
        sql: team_id
        type: number
        public: false

      - name: team_side
        title: 隊伍
        description: "藍隊（team_id 100）或紅隊。"
        sql: "CASE WHEN {CUBE}.team_id = 100 THEN '藍隊' ELSE '紅隊' END"
        type: string
        meta:
          group: 對局

      - name: win
        sql: win
        type: number
        public: false

      # 同隊有幾個「追蹤中」的朋友。用相關子查詢而不是存欄位,因為追蹤名單
      # 之後還會變,存下來就會過期。
      - name: party_size
        title: 同隊朋友數
        description: "我方隊伍裡除了自己之外，有幾個追蹤中的帳號（0-4）。依目前的追蹤名單即時計算。"
        # 子查詢沒有欄位型別親和性，而 Cube 的篩選值一律綁成字串：宣告成 number 時
        # equals '1' 永遠為假（下鑽路徑點「1」查到 0 場）。轉成文字、宣告成 string，
        # 篩選才對得上；值只有 0-4 一位數，排序不受影響。
        sql: >
          CAST((SELECT COUNT(*) FROM match_participants o
            WHERE o.platform_id = {CUBE}.platform_id AND o.game_id = {CUBE}.game_id
              AND o.team_id = {CUBE}.team_id AND o.puuid <> {CUBE}.puuid
              AND o.puuid IN (SELECT puuid FROM accounts WHERE tracked = 1)) AS TEXT)
        type: string
        meta:
          group: 對局

      - name: result
        title: 勝負
        description: "這一場的勝負：勝 / 敗。"
        sql: "CASE WHEN {CUBE}.win = 1 THEN '勝' ELSE '敗' END"
        type: string
        meta:
          group: 對局

      - name: champ_level
        title: 結束等級
        description: "對局結束時的英雄等級。"
        sql: champ_level
        type: number
        meta:
          group: 對局

      - name: death_bucket
        title: 死亡數級距
        description: "單場死亡數分組：0-5 次、6-10 次、11-15 次、16 次以上。"
        sql: >
          CASE WHEN {CUBE}.deaths <= 5 THEN '0-5 次'
               WHEN {CUBE}.deaths <= 10 THEN '6-10 次'
               WHEN {CUBE}.deaths <= 15 THEN '11-15 次'
               ELSE '16 次以上' END
        type: string
        meta:
          group: 對局

      - name: spell_1
        title: 召喚師技能 1
        description: "第一格召喚師技能名稱；來自對局結束時保存的 spell1_id。"
        sql: "(SELECT s.name FROM dim_spells s WHERE s.id = {CUBE}.spell1_id)"
        type: string
        meta:
          group: 配置

      - name: spell_2
        title: 召喚師技能 2
        description: "第二格召喚師技能名稱；來自對局結束時保存的 spell2_id。"
        sql: "(SELECT s.name FROM dim_spells s WHERE s.id = {CUBE}.spell2_id)"
        type: string
        meta:
          group: 配置

      - name: spell_pair
        title: 召喚師技能組合
        description: "以技能 ID 排序的兩格召喚師技能組合，避免同一組因位置不同被拆成兩組。"
        sql: >
          CASE WHEN {CUBE}.spell1_id = 0 AND {CUBE}.spell2_id = 0 THEN '（無）'
               WHEN {CUBE}.spell1_id <= {CUBE}.spell2_id THEN
                 COALESCE((SELECT s.name FROM dim_spells s WHERE s.id = {CUBE}.spell1_id), CAST({CUBE}.spell1_id AS TEXT)) || ' + ' ||
                 COALESCE((SELECT s.name FROM dim_spells s WHERE s.id = {CUBE}.spell2_id), CAST({CUBE}.spell2_id AS TEXT))
               ELSE
                 COALESCE((SELECT s.name FROM dim_spells s WHERE s.id = {CUBE}.spell2_id), CAST({CUBE}.spell2_id AS TEXT)) || ' + ' ||
                 COALESCE((SELECT s.name FROM dim_spells s WHERE s.id = {CUBE}.spell1_id), CAST({CUBE}.spell1_id AS TEXT)) END
        type: string
        meta:
          group: 配置

      - name: damage_profile
        title: 對英雄傷害類型
        description: "依對英雄物理、魔法、真實傷害占比分類；這是對局結束後的實際輸出組成。"
        sql: >
          CASE WHEN COALESCE({CUBE}.dmg_physical, 0) + COALESCE({CUBE}.dmg_magic, 0) + COALESCE({CUBE}.dmg_true, 0) = 0 THEN '無對英雄傷害'
               WHEN {CUBE}.dmg_physical * 1.0 / NULLIF({CUBE}.dmg_physical + {CUBE}.dmg_magic + {CUBE}.dmg_true, 0) >= 0.6 THEN '物理為主'
               WHEN {CUBE}.dmg_magic * 1.0 / NULLIF({CUBE}.dmg_physical + {CUBE}.dmg_magic + {CUBE}.dmg_true, 0) >= 0.6 THEN '魔法為主'
               WHEN {CUBE}.dmg_true * 1.0 / NULLIF({CUBE}.dmg_physical + {CUBE}.dmg_magic + {CUBE}.dmg_true, 0) >= 0.6 THEN '真傷為主'
               ELSE '混合' END
        type: string
        meta:
          group: 輸出

      - name: augment_count
        title: 增幅數量
        description: "該玩家該場在資料庫中保存的增幅列數；不代表遊戲內可選的增幅數或候選池。"
        sql: >
          CAST((SELECT COUNT(*) FROM participant_augments a
            WHERE a.platform_id = {CUBE}.platform_id AND a.game_id = {CUBE}.game_id
              AND a.participant_id = {CUBE}.participant_id) AS TEXT)
        type: string
        meta:
          group: 配置

    measures:
      - name: games
        title: 玩家對局數
        sql: "{CUBE}.rowid"
        type: count_distinct
        description: 玩家參與的對局數。以玩家對局列去重；以增幅、裝備或英雄定位分組時仍不會重複。單一玩家視角下等同對局數。
        meta:
          group: 基本
          decimals: 0

      - name: wins
        title: 勝場
        description: "玩家獲勝的對局數。"
        sql: "CASE WHEN {CUBE}.win = 1 THEN {CUBE}.rowid END"
        type: count_distinct
        meta:
          group: 基本
          decimals: 0

      - name: losses
        title: 敗場
        description: "玩家落敗的對局數。"
        sql: "CASE WHEN {CUBE}.win = 0 THEN {CUBE}.rowid END"
        type: count_distinct
        meta:
          group: 基本
          decimals: 0

      # 陣容頁用：以「隊伍」為單位計數。所有人模式下一隊五人各是一列，用 games 會把同一隊算五次；
      # 陣容是整隊的屬性，所以場次要去重到（對局, 隊伍）。只看一個帳號時和 games 相同。
      - name: team_games
        title: 隊伍場次
        description: "不重複的（對局, 隊伍）數。多人視角下同一隊只算一次；單一玩家視角等同 games。"
        sql: "{CUBE}.platform_id || ':' || {CUBE}.game_id || ':' || {CUBE}.team_id"
        type: count_distinct
        meta:
          group: 基本
          decimals: 0

      - name: team_wins
        title: 隊伍勝場
        description: "team_games 裡贏的隊伍數。"
        sql: "CASE WHEN {CUBE}.win = 1 THEN {CUBE}.platform_id || ':' || {CUBE}.game_id || ':' || {CUBE}.team_id END"
        type: count_distinct
        meta:
          group: 基本
          decimals: 0

      - name: team_winrate
        title: 隊伍勝率
        description: "team_wins / team_games。"
        sql: "100.0 * {team_wins} / NULLIF({team_games}, 0)"
        type: number
        format: percent
        meta:
          group: 基本
          unit: "%"
          decimals: 1

      - name: match_count
        title: 對局數
        description: "不重複的遊戲對局數。跨玩家查詢時用來看實際打了幾場；和玩家對局數不同。"
        sql: "{CUBE}.platform_id || ':' || {CUBE}.game_id"
        type: count_distinct
        meta:
          group: 基本
          decimals: 0

      - name: winrate
        title: 勝率
        description: "勝場 ÷ 場次 × 100（%）。場次少於 5 場時多半是雜訊。"
        sql: "100.0 * {wins} / NULLIF({games}, 0)"
        type: number
        format: percent
        meta:
          group: 基本
          unit: "%"
          decimals: 1
          higherIsBetter: true

      - name: deaths_per_10min
        title: 每 10 分鐘死亡
        description: "每場死亡數換算成每 10 分鐘後取平均，適合比較不同長度的對局。"
        sql: "{CUBE}.deaths * 600.0 / NULLIF({CUBE}.game_duration, 0)"
        type: avg
        meta:
          group: 戰鬥
          decimals: 1
          higherIsBetter: false

      - name: taken_per_min
        title: 每分鐘承受傷害
        description: "每場承受總傷害除以對局分鐘數後取平均。"
        sql: "{CUBE}.dmg_taken * 60.0 / NULLIF({CUBE}.game_duration, 0)"
        type: avg
        meta:
          group: 生存
          decimals: 0

      - name: mitigated_per_min
        title: 每分鐘減免傷害
        description: "每場減免傷害除以對局分鐘數後取平均；不等於減傷百分比。"
        sql: "{CUBE}.dmg_mitigated * 60.0 / NULLIF({CUBE}.game_duration, 0)"
        type: avg
        meta:
          group: 生存
          decimals: 0

      - name: heal_per_min
        title: 每分鐘治療
        description: "每場總治療量（包含自療）除以對局分鐘數後取平均。"
        sql: "{CUBE}.total_heal * 60.0 / NULLIF({CUBE}.game_duration, 0)"
        type: avg
        meta:
          group: 生存
          decimals: 0

      - name: cc_time_per_min
        title: 每分鐘控場
        description: "每場 timeCCingOthers 除以對局分鐘數後取平均；保留與 cc_duration 的來源區別。"
        sql: "{CUBE}.time_ccing_others * 60.0 / NULLIF({CUBE}.game_duration, 0)"
        type: avg
        meta:
          group: 戰鬥
          unit: 秒
          decimals: 1

      - name: cs_per_min
        title: 每分鐘補兵
        description: "每場補兵數除以對局分鐘數後取平均。"
        sql: "{CUBE}.cs * 60.0 / NULLIF({CUBE}.game_duration, 0)"
        type: avg
        meta:
          group: 資源
          decimals: 1

      - name: physical_damage_share
        title: 物理傷害佔比
        description: "對英雄傷害中物理傷害的比例，使用三種對英雄傷害合計作分母。"
        sql: "{CUBE}.dmg_physical * 100.0 / NULLIF({CUBE}.dmg_physical + {CUBE}.dmg_magic + {CUBE}.dmg_true, 0)"
        type: avg
        format: percent
        meta: { group: 輸出, unit: "%", decimals: 1 }

      - name: magic_damage_share
        title: 魔法傷害佔比
        description: "對英雄傷害中魔法傷害的比例，使用三種對英雄傷害合計作分母。"
        sql: "{CUBE}.dmg_magic * 100.0 / NULLIF({CUBE}.dmg_physical + {CUBE}.dmg_magic + {CUBE}.dmg_true, 0)"
        type: avg
        format: percent
        meta: { group: 輸出, unit: "%", decimals: 1 }

      - name: true_damage_share
        title: 真實傷害佔比
        description: "對英雄傷害中真實傷害的比例，使用三種對英雄傷害合計作分母。"
        sql: "{CUBE}.dmg_true * 100.0 / NULLIF({CUBE}.dmg_physical + {CUBE}.dmg_magic + {CUBE}.dmg_true, 0)"
        type: avg
        format: percent
        meta: { group: 輸出, unit: "%", decimals: 1 }

      - name: taken_true_share
        title: 承受真傷佔比
        description: "承受傷害中真實傷害的比例，使用物理、魔法、真實承受傷害合計作分母。"
        sql: "{CUBE}.taken_true * 100.0 / NULLIF({CUBE}.taken_physical + {CUBE}.taken_magic + {CUBE}.taken_true, 0)"
        type: avg
        format: percent
        meta: { group: 生存, unit: "%", decimals: 1 }

      - name: gold_share
        title: 團隊經濟佔比
        description: "個人獲得金錢除以我方團隊獲得金錢，再取平均。"
        sql: "{CUBE}.gold_earned * 100.0 / NULLIF({CUBE}.team_gold, 0)"
        type: avg
        format: percent
        meta: { group: 資源, unit: "%", decimals: 1 }

      - name: objective_damage_per_min
        title: 每分鐘目標傷害
        description: "每場對建築與中立目標傷害除以對局分鐘數後取平均。"
        sql: "{CUBE}.dmg_to_objectives * 60.0 / NULLIF({CUBE}.game_duration, 0)"
        type: avg
        meta:
          group: 輸出
          decimals: 0

      - name: first_tower_kill_rate
        title: 首塔擊殺率
        description: "自己取得首塔擊殺的玩家對局比例；不等於隊伍取得首塔的比例。"
        sql: >
          100.0 * COUNT(DISTINCT CASE WHEN {CUBE}.first_tower = 1 THEN {CUBE}.rowid END)
          / NULLIF({games}, 0)
        type: number
        format: percent
        meta: { group: 團隊, unit: "%", decimals: 1 }

      - name: avg_kills
        title: 平均擊殺
        description: "每場平均擊殺數。"
        sql: kills
        type: avg
        meta:
          group: 戰鬥
          decimals: 1

      - name: avg_deaths
        title: 平均死亡
        description: "每場平均死亡數，越低越好。"
        sql: deaths
        type: avg
        meta:
          group: 戰鬥
          decimals: 1
          higherIsBetter: false

      # 單場巔峰紀錄：和 avg_* 分開，避免把「平均表現」誤當成「最好的一場」。
      - name: max_kills
        title: 單場最高擊殺
        description: "範圍內單場最高擊殺數。"
        sql: kills
        type: max
        meta:
          group: 單場紀錄
          decimals: 0

      - name: max_deaths
        title: 單場最高死亡
        description: "範圍內單場最高死亡數；這是極端紀錄，不代表表現較好。"
        sql: deaths
        type: max
        meta:
          group: 單場紀錄
          decimals: 0
          higherIsBetter: false

      - name: max_deaths_per_min
        title: 單場最高每分鐘死亡
        description: "範圍內單場最高的每分鐘死亡數；用來找出最密集的死亡場次，不代表表現較好。"
        sql: "{CUBE}.deaths * 60.0 / NULLIF({CUBE}.game_duration, 0)"
        type: max
        meta:
          group: 單場紀錄
          unit: 每分鐘
          decimals: 2
          higherIsBetter: false

      - name: max_assists
        title: 單場最高助攻
        description: "範圍內單場最高助攻數。"
        sql: assists
        type: max
        meta:
          group: 單場紀錄
          decimals: 0

      - name: max_damage
        title: 單場最高對英雄傷害
        description: "範圍內單場對英雄造成的最高傷害。"
        sql: dmg_to_champions
        type: max
        meta:
          group: 單場紀錄
          decimals: 0

      - name: max_dpm
        title: 單場最高每分鐘傷害
        description: "範圍內單場最高的每分鐘對英雄傷害。"
        sql: "{CUBE}.dmg_to_champions * 60.0 / NULLIF({CUBE}.game_duration, 0)"
        type: max
        meta:
          group: 單場紀錄
          unit: 每分鐘
          decimals: 0

      - name: max_objective_damage
        title: 單場最高推塔傷害
        description: "範圍內單場對建築造成的最高傷害。"
        sql: dmg_to_objectives
        type: max
        meta:
          group: 單場紀錄
          decimals: 0

      - name: max_cc
        title: 單場最高控場時間
        description: "範圍內單場對敵人施加的最高控場時間。"
        sql: cc_duration
        type: max
        meta:
          group: 單場紀錄
          unit: 秒
          decimals: 0

      - name: max_largest_spree
        title: 單場最高連殺
        description: "範圍內單場最高連續擊殺數。"
        sql: largest_spree
        type: max
        meta:
          group: 單場紀錄
          decimals: 0

      - name: max_largest_multi_kill
        title: 單場最高多殺
        description: "範圍內單場最高多殺等級：雙殺為 2，三殺為 3，依此類推。"
        sql: largest_multi_kill
        type: max
        meta:
          group: 單場紀錄
          decimals: 0

      - name: max_duration
        title: 單場最高時長
        description: "範圍內單場最長對局時間。"
        sql: "{CUBE}.game_duration / 60.0"
        type: max
        meta:
          group: 單場紀錄
          unit: 分鐘
          decimals: 2

      - name: max_taken
        title: 單場最高承受傷害
        description: "範圍內單場承受的最高總傷害。"
        sql: dmg_taken
        type: max
        meta:
          group: 單場紀錄
          decimals: 0

      - name: max_mitigated
        title: 單場最高減免傷害
        description: "範圍內單場透過護甲、魔抗與其他效果減免的最高傷害。"
        sql: dmg_mitigated
        type: max
        meta:
          group: 單場紀錄
          decimals: 0

      - name: max_heal
        title: 單場最高治療量
        description: "範圍內單場最高總治療量，包含自我治療。"
        sql: total_heal
        type: max
        meta:
          group: 單場紀錄
          decimals: 0

      - name: max_gpm
        title: 單場最高每分鐘經濟
        description: "範圍內單場最高每分鐘獲得金錢。"
        sql: "{CUBE}.gold_earned * 60.0 / NULLIF({CUBE}.game_duration, 0)"
        type: max
        meta:
          group: 單場紀錄
          unit: 每分鐘
          decimals: 0

      - name: max_cs
        title: 單場最高補兵
        description: "範圍內單場最高擊殺小兵數。"
        sql: cs
        type: max
        meta:
          group: 單場紀錄
          decimals: 0

      - name: max_turret_kills
        title: 單場最高防禦塔擊殺
        description: "範圍內單場親手摧毀的最高防禦塔數。"
        sql: turret_kills
        type: max
        meta:
          group: 單場紀錄
          decimals: 0

      - name: max_penta_kills
        title: 單場最高五殺次數
        description: "範圍內單場最高五殺次數。"
        sql: penta_kills
        type: max
        meta:
          group: 單場紀錄
          decimals: 0

      - name: max_crit
        title: 單場最高單次暴擊傷害
        description: "範圍內單場最高單次暴擊傷害。"
        sql: largest_crit
        type: max
        meta:
          group: 單場紀錄
          decimals: 0

      - name: avg_time_dead
        title: 平均死亡時間
        description: "每場平均在死亡倒數裡的總秒數（totalTimeSpentDead）。對局明細沒有這個欄位，只有賽後統計有：只算開始擷取賽後統計之後、而且採集器有抓到賽後畫面的場次（場數見 time_dead_games）。"
        sql: time_spent_dead
        type: avg
        meta:
          group: 戰鬥
          unit: 秒
          decimals: 0
          higherIsBetter: false

      - name: time_dead_share
        title: 死亡時間佔比
        description: "死亡總時間佔全場時間的比例（%），每場先算再平均。只算有賽後統計的場次，同平均死亡時間。"
        sql: "{CUBE}.time_spent_dead * 100.0 / NULLIF({CUBE}.game_duration, 0)"
        type: avg
        format: percent
        meta:
          group: 戰鬥
          unit: "%"
          decimals: 1
          higherIsBetter: false

      - name: time_dead_games
        title: 有死亡時間的場次
        description: "有賽後統計（死亡總時間）的場次數，平均死亡時間與死亡時間佔比只算這些場次。"
        sql: "CASE WHEN {CUBE}.time_spent_dead IS NOT NULL THEN {CUBE}.rowid END"
        type: count_distinct
        meta:
          group: 戰鬥

      - name: avg_assists
        title: 平均助攻
        description: "每場平均助攻數。"
        sql: assists
        type: avg
        meta:
          group: 戰鬥
          decimals: 1

      - name: kda
        title: KDA
        description: "(平均擊殺 + 平均助攻) ÷ 平均死亡。先各自平均再相除，不是每場 KDA 的平均。"
        sql: "({avg_kills} + {avg_assists}) / NULLIF({avg_deaths}, 0)"
        type: number
        meta:
          group: 戰鬥
          decimals: 2
          higherIsBetter: true

      - name: kill_participation
        title: 參團率
        description: "每場 (擊殺 + 助攻) ÷ 我方總擊殺 × 100，再取平均（%）。"
        sql: "({CUBE}.kills + {CUBE}.assists) * 100.0 / NULLIF({CUBE}.team_kills, 0)"
        type: avg
        format: percent
        meta:
          group: 戰鬥
          unit: "%"
          decimals: 1
          higherIsBetter: true

      - name: multikills
        title: 多殺次數
        sql: "{CUBE}.double_kills + {CUBE}.triple_kills + {CUBE}.quadra_kills + {CUBE}.penta_kills"
        type: sum
        description: 雙殺以上的總次數
        meta:
          group: 戰鬥
          decimals: 0

      - name: pentas
        title: 五殺次數
        description: "五殺的總次數（加總，不是平均）。"
        sql: penta_kills
        type: sum
        meta:
          group: 戰鬥
          decimals: 0

      - name: multikill_rate
        title: 多殺場次率
        sql: >
          100.0 * COUNT(DISTINCT CASE
            WHEN {CUBE}.double_kills + {CUBE}.triple_kills
               + {CUBE}.quadra_kills + {CUBE}.penta_kills > 0
            THEN {CUBE}.platform_id || ':' || {CUBE}.game_id END)
          / NULLIF({games}, 0)
        type: number
        format: percent
        description: 有拿到多殺的場次佔比
        meta:
          group: 戰鬥
          unit: "%"
          decimals: 1
          higherIsBetter: true

      - name: first_blood_rate
        title: 首殺率
        description: "親自拿到首殺的場次佔比（%）。"
        sql: >
          100.0 * COUNT(DISTINCT CASE WHEN {CUBE}.first_blood = 1
            THEN {CUBE}.platform_id || ':' || {CUBE}.game_id END)
          / NULLIF({games}, 0)
        type: number
        format: percent
        meta:
          group: 戰鬥
          unit: "%"
          decimals: 1

      - name: avg_damage
        title: 平均對英雄傷害
        description: "每場平均對敵方英雄造成的傷害。"
        sql: dmg_to_champions
        type: avg
        meta:
          group: 輸出
          decimals: 0

      - name: dpm
        title: 每分鐘傷害
        sql: "{CUBE}.dmg_to_champions * 60.0 / NULLIF({CUBE}.game_duration, 0)"
        type: avg
        description: 每分鐘對英雄傷害
        meta:
          group: 輸出
          decimals: 0
          higherIsBetter: true

      - name: damage_share
        title: 傷害佔比
        description: "每場 我對英雄傷害 ÷ 我方五人對英雄傷害總和 × 100，再取平均（%）。"
        sql: "{CUBE}.dmg_to_champions * 100.0 / NULLIF({CUBE}.team_dmg, 0)"
        type: avg
        format: percent
        meta:
          group: 輸出
          unit: "%"
          decimals: 1
          higherIsBetter: true

      - name: damage_per_gold
        title: 每塊錢傷害
        sql: "{CUBE}.dmg_to_champions * 1.0 / NULLIF({CUBE}.gold_earned, 0)"
        type: avg
        description: 經濟轉換成輸出的效率，看得出誰是把錢花在刀口上
        meta:
          group: 輸出
          decimals: 2
          higherIsBetter: true

      - name: avg_objective_damage
        title: 平均建築傷害
        description: "每場平均對建築與中立目標造成的傷害。大亂鬥沒有中立目標，實測和對防禦塔傷害完全相同（5,910 筆）。"
        sql: dmg_to_objectives
        type: avg
        meta:
          group: 輸出
          decimals: 0

      - name: avg_taken
        title: 平均承受傷害
        description: "每場平均承受的總傷害。"
        sql: dmg_taken
        type: avg
        meta:
          group: 生存
          decimals: 0

      - name: tank_share
        title: 承受佔比
        sql: >
          {CUBE}.dmg_taken * 100.0 / NULLIF(
            (SELECT SUM(t.dmg_taken) FROM match_participants t
             WHERE t.platform_id = {CUBE}.platform_id
               AND t.game_id = {CUBE}.game_id
               AND t.team_id = {CUBE}.team_id), 0)
        type: avg
        format: percent
        description: 承受傷害佔隊伍的比例，和傷害佔比對照可看出定位
        meta:
          group: 生存
          unit: "%"
          decimals: 1

      - name: avg_mitigated
        title: 平均減免傷害
        description: "每場平均靠護甲、魔抗、護盾等減免掉的傷害。"
        sql: dmg_mitigated
        type: avg
        meta:
          group: 生存
          decimals: 0

      - name: avg_heal
        title: 平均治療量
        description: "每場平均治療總量（含治療自己與隊友）。"
        sql: total_heal
        type: avg
        meta:
          group: 生存
          decimals: 0

      - name: avg_survival
        title: 平均最久存活
        sql: longest_time_living
        type: avg
        description: 單場中最長一次沒有死亡的時間（秒）
        meta:
          group: 生存
          unit: 秒
          decimals: 0

      - name: taken_physical_share
        title: 承受物理佔比
        sql: "{CUBE}.taken_physical * 100.0 / NULLIF({CUBE}.taken_physical + {CUBE}.taken_magic + {CUBE}.taken_true, 0)"
        type: avg
        format: percent
        description: 承受的傷害裡有多少是物理。偏高代表死在 AD 手上，可考慮補護甲
        meta:
          group: 生存
          unit: "%"
          decimals: 1

      - name: taken_magic_share
        title: 承受魔法佔比
        description: "承受的傷害裡魔法傷害的比例（%）。偏高代表死在 AP 手上，可考慮補魔抗。"
        sql: "{CUBE}.taken_magic * 100.0 / NULLIF({CUBE}.taken_physical + {CUBE}.taken_magic + {CUBE}.taken_true, 0)"
        type: avg
        format: percent
        meta:
          group: 生存
          unit: "%"
          decimals: 1

      - name: champion_damage_focus
        title: 對英雄傷害佔比
        sql: "{CUBE}.dmg_to_champions * 100.0 / NULLIF({CUBE}.total_damage, 0)"
        type: avg
        format: percent
        description: 總輸出裡有多少打在英雄身上。偏低代表花很多時間在清兵
        meta:
          group: 輸出
          unit: "%"
          decimals: 1

      - name: avg_cc
        title: 平均控場時間
        description: "每場平均對敵人施加控場的總時間（秒）。"
        sql: cc_duration
        type: avg
        meta:
          group: 戰鬥
          unit: 秒
          decimals: 0

      - name: avg_largest_spree
        title: 平均最高連殺
        description: "每場最高連續擊殺數的平均。"
        sql: largest_spree
        type: avg
        meta:
          group: 戰鬥
          decimals: 1

      - name: objective_damage_share
        title: 建築傷害佔比
        description: "對建築傷害佔我方全隊的比例（%），每場先算再取平均。看誰是隊上主要拆塔的人；射手天生偏高，比人時要搭配出裝定位看。"
        sql: >
          {CUBE}.dmg_to_objectives * 100.0 / NULLIF(
            (SELECT SUM(t.dmg_to_objectives) FROM match_participants t
             WHERE t.platform_id = {CUBE}.platform_id AND t.game_id = {CUBE}.game_id AND t.team_id = {CUBE}.team_id), 0)
        type: avg
        format: percent
        meta:
          group: 推進
          unit: "%"
          decimals: 1

      - name: total_turret_kills
        title: 推塔總數
        description: "範圍內親手摧毀（最後一擊）的防禦塔總數。"
        sql: turret_kills
        type: sum
        meta:
          group: 推進

      - name: avg_inhibitor_kills
        title: 平均摧毀兵營
        description: "每場平均親手摧毀（最後一擊）的兵營數。"
        sql: inhibitor_kills
        type: avg
        meta:
          group: 推進
          decimals: 2

      # 對局資料沒有「對小兵傷害」這個欄位（賽後統計也沒有），用總輸出扣掉對英雄與對建築的傷害估計：
      # 大亂鬥沒有野怪（中立怪擊殺 5,910 筆全是 0），剩下的幾乎都是打在小兵身上（另含少量召喚物、假人之類）。
      - name: avg_minion_damage
        title: 平均小兵傷害（估）
        description: "每場平均對小兵的傷害，估計值：總輸出 − 對英雄傷害 − 對建築傷害（大亂鬥沒有野怪，剩下的幾乎都是小兵）。"
        sql: "({CUBE}.total_damage - {CUBE}.dmg_to_champions - COALESCE({CUBE}.dmg_to_objectives, 0))"
        type: avg
        meta:
          group: 推進
          decimals: 0

      - name: minion_damage_per_min
        title: 每分鐘小兵傷害（估）
        description: "每分鐘對小兵的傷害，估計值，算法同平均小兵傷害。每場先除以對局分鐘數再取平均。"
        sql: "({CUBE}.total_damage - {CUBE}.dmg_to_champions - COALESCE({CUBE}.dmg_to_objectives, 0)) * 60.0 / NULLIF({CUBE}.game_duration, 0)"
        type: avg
        meta:
          group: 推進
          decimals: 0

      - name: avg_turret_kills
        title: 平均推塔數
        description: "每場平均摧毀的防禦塔數。"
        sql: turret_kills
        type: avg
        meta:
          group: 輸出
          decimals: 2

      - name: best_crit
        title: 最高單次暴擊
        description: "範圍內單次暴擊的最高傷害（取最大值，不是平均）。"
        sql: largest_crit
        type: max
        meta:
          group: 戰鬥
          decimals: 0

      - name: avg_units_healed
        title: 平均治療目標數
        sql: units_healed
        type: avg
        description: 治療影響到幾個單位，輔助型玩法會明顯偏高
        meta:
          group: 生存
          decimals: 1

      - name: avg_gold
        title: 平均經濟
        description: "每場平均獲得的金錢。"
        sql: gold_earned
        type: avg
        meta:
          group: 資源
          decimals: 0

      - name: gpm
        title: 每分鐘經濟
        description: "每分鐘獲得的金錢。每場先除以對局時間再取平均。"
        sql: "{CUBE}.gold_earned * 60.0 / NULLIF({CUBE}.game_duration, 0)"
        type: avg
        meta:
          group: 資源
          decimals: 0
          higherIsBetter: true

      - name: avg_cs
        title: 平均補兵
        description: "每場平均擊殺小兵數。"
        sql: cs
        type: avg
        meta:
          group: 資源
          decimals: 1

      - name: unspent_gold
        title: 平均剩餘金錢
        sql: "{CUBE}.gold_earned - {CUBE}.gold_spent"
        type: avg
        description: 沒花掉的錢。偏高代表死亡時身上留太多，或回城買裝不夠積極
        meta:
          group: 資源
          decimals: 0
          higherIsBetter: false

      # 我方與敵方的團隊加總。這些欄位在同一隊的五列裡是一樣的,所以只有在
      # 「鎖定單一玩家」時平均才有意義——敗因分析頁一律有帳號篩選。
      - name: avg_team_dmg
        title: 我方總傷害
        description: "我方五人對英雄傷害總和的每場平均。同隊五人這個值相同，只在鎖定單一玩家時有意義。"
        sql: team_dmg
        type: avg
        meta: { group: 團隊, decimals: 0 }

      - name: avg_enemy_dmg
        title: 敵方總傷害
        description: "敵方五人對英雄傷害總和的每場平均。只在鎖定單一玩家時有意義。"
        sql: enemy_dmg
        type: avg
        meta: { group: 團隊, decimals: 0 }

      - name: dmg_gap
        title: 傷害差
        sql: "{avg_team_dmg} - {avg_enemy_dmg}"
        type: number
        description: 我方總傷害減敵方總傷害。負的代表輸出被壓過去。
        meta: { group: 團隊, decimals: 0, higherIsBetter: true }

      - name: avg_team_gold
        title: 我方總經濟
        description: "我方五人獲得金錢總和的每場平均。只在鎖定單一玩家時有意義。"
        sql: team_gold
        type: avg
        meta: { group: 團隊, decimals: 0 }

      - name: avg_enemy_gold
        title: 敵方總經濟
        description: "敵方五人獲得金錢總和的每場平均。只在鎖定單一玩家時有意義。"
        sql: enemy_gold
        type: avg
        meta: { group: 團隊, decimals: 0 }

      - name: gold_gap
        title: 經濟差
        description: "我方總經濟減敵方總經濟。負的代表經濟落後。比較勝敗時請改用每分鐘經濟差。"
        sql: "{avg_team_gold} - {avg_enemy_gold}"
        type: number
        meta: { group: 團隊, decimals: 0, higherIsBetter: true }

      - name: avg_team_kills
        title: 我方總擊殺
        description: "我方總擊殺的每場平均。只在鎖定單一玩家時有意義。"
        sql: team_kills
        type: avg
        meta: { group: 團隊, decimals: 1 }

      - name: avg_enemy_kills
        title: 敵方總擊殺
        description: "敵方總擊殺的每場平均。只在鎖定單一玩家時有意義。"
        sql: enemy_kills
        type: avg
        meta: { group: 團隊, decimals: 1 }

      - name: kill_gap
        title: 擊殺差
        description: "我方總擊殺減敵方總擊殺。負的代表人頭落後。"
        sql: "{avg_team_kills} - {avg_enemy_kills}"
        type: number
        meta: { group: 團隊, decimals: 1, higherIsBetter: true }

      # 團隊差距的每分鐘版本。原始總量會被局長帶著走——敗局平均 17 分、勝局
      # 15.1 分,光是時間差就會讓敗局的雙方總傷害都變高。要比較勝敗必須除以時間。
      - name: team_dpm
        title: 我方每分鐘傷害
        description: "我方五人每分鐘對英雄傷害總和。比較勝局與敗局時用這個，不受對局長短影響。"
        sql: "{CUBE}.team_dmg * 60.0 / NULLIF({CUBE}.game_duration, 0)"
        type: avg
        meta: { group: 團隊, decimals: 0 }

      - name: enemy_dpm
        title: 敵方每分鐘傷害
        description: "敵方五人每分鐘對英雄傷害總和。"
        sql: "{CUBE}.enemy_dmg * 60.0 / NULLIF({CUBE}.game_duration, 0)"
        type: avg
        meta: { group: 團隊, decimals: 0 }

      - name: dpm_gap
        title: 每分鐘傷害差
        description: "我方每分鐘傷害減敵方每分鐘傷害。負的代表輸出被壓過去。"
        sql: "{team_dpm} - {enemy_dpm}"
        type: number
        meta: { group: 團隊, decimals: 0, higherIsBetter: true }

      - name: team_gpm
        title: 我方每分鐘經濟
        description: "我方五人每分鐘經濟總和。"
        sql: "{CUBE}.team_gold * 60.0 / NULLIF({CUBE}.game_duration, 0)"
        type: avg
        meta: { group: 團隊, decimals: 0 }

      - name: enemy_gpm
        title: 敵方每分鐘經濟
        description: "敵方五人每分鐘經濟總和。"
        sql: "{CUBE}.enemy_gold * 60.0 / NULLIF({CUBE}.game_duration, 0)"
        type: avg
        meta: { group: 團隊, decimals: 0 }

      - name: gpm_gap
        title: 每分鐘經濟差
        description: "我方每分鐘經濟減敵方每分鐘經濟。負的代表經濟落後。"
        sql: "{team_gpm} - {enemy_gpm}"
        type: number
        meta: { group: 團隊, decimals: 0, higherIsBetter: true }

      # ── 單場紀錄：每分鐘數值「最高的那一場」 ──────────────────────────────────
      # 和上面的每分鐘指標成對:那些是 avg(每場先除以對局時間,再把各場平均起來),
      # 這些是 max(範圍內最高的那一場)。算式一字不差地照抄對應的 avg 指標,
      # 兩邊才不會各有一套定義。
      #
      # 以 participants.participant_key 分組時一組只有一列,max 等於那一場自己的值——
      # 所以「最高是多少」和「是哪幾場」可以用同一個指標查,紀錄榜上的數字和清單裡的
      # 數字保證同源。追蹤對象頁的紀錄榜就是這樣用的。
      #
      # 分母是整場時間,短局的每分鐘值天生偏高(前期人頭密、補兵少),畫面上要一起
      # 顯示那一場的長度。重開局(matches.is_remake)本來就不在這個 cube 裡。
      - name: best_kills_per_min
        title: 單場最高每分鐘擊殺
        description: "範圍內每分鐘擊殺最高的那一場的值（擊殺 ÷ 對局分鐘數）。以參賽者鍵分組時就是該場的值。"
        sql: "{CUBE}.kills * 60.0 / NULLIF({CUBE}.game_duration, 0)"
        type: max
        meta:
          group: 紀錄
          decimals: 2
          higherIsBetter: true

      - name: best_assists_per_min
        title: 單場最高每分鐘助攻
        description: "範圍內每分鐘助攻最高的那一場的值（助攻 ÷ 對局分鐘數）。"
        sql: "{CUBE}.assists * 60.0 / NULLIF({CUBE}.game_duration, 0)"
        type: max
        meta:
          group: 紀錄
          decimals: 2
          higherIsBetter: true

      - name: best_taken_per_min
        title: 單場最高每分鐘承受傷害
        description: "範圍內每分鐘承受傷害最高的那一場的值。算式同每分鐘承受傷害。"
        sql: "{CUBE}.dmg_taken * 60.0 / NULLIF({CUBE}.game_duration, 0)"
        type: max
        meta:
          group: 紀錄
          decimals: 0

      - name: best_mitigated_per_min
        title: 單場最高每分鐘減免傷害
        description: "範圍內每分鐘減免傷害最高的那一場的值。算式同每分鐘減免傷害。"
        sql: "{CUBE}.dmg_mitigated * 60.0 / NULLIF({CUBE}.game_duration, 0)"
        type: max
        meta:
          group: 紀錄
          decimals: 0

      - name: best_heal_per_min
        title: 單場最高每分鐘治療
        description: "範圍內每分鐘治療量（含自補）最高的那一場的值。算式同每分鐘治療。"
        sql: "{CUBE}.total_heal * 60.0 / NULLIF({CUBE}.game_duration, 0)"
        type: max
        meta:
          group: 紀錄
          decimals: 0

      - name: best_cc_time_per_min
        title: 單場最高每分鐘控場
        description: "範圍內每分鐘控場時間（timeCCingOthers）最高的那一場的值。算式同每分鐘控場。"
        sql: "{CUBE}.time_ccing_others * 60.0 / NULLIF({CUBE}.game_duration, 0)"
        type: max
        meta:
          group: 紀錄
          unit: 秒
          decimals: 1
          higherIsBetter: true

      - name: best_cs_per_min
        title: 單場最高每分鐘補兵
        description: "範圍內每分鐘補兵最高的那一場的值。算式同每分鐘補兵。"
        sql: "{CUBE}.cs * 60.0 / NULLIF({CUBE}.game_duration, 0)"
        type: max
        meta:
          group: 紀錄
          decimals: 1
          higherIsBetter: true

      - name: best_objective_damage_per_min
        title: 單場最高每分鐘建築傷害
        description: "範圍內每分鐘對建築與中立目標傷害最高的那一場的值。算式同每分鐘目標傷害。"
        sql: "{CUBE}.dmg_to_objectives * 60.0 / NULLIF({CUBE}.game_duration, 0)"
        type: max
        meta:
          group: 紀錄
          decimals: 0
          higherIsBetter: true

      - name: best_minion_damage_per_min
        title: 單場最高每分鐘小兵傷害（估）
        description: "範圍內每分鐘小兵傷害（估計值：總輸出 − 對英雄 − 對建築）最高的那一場的值。算式同每分鐘小兵傷害（估）。"
        sql: "({CUBE}.total_damage - {CUBE}.dmg_to_champions - COALESCE({CUBE}.dmg_to_objectives, 0)) * 60.0 / NULLIF({CUBE}.game_duration, 0)"
        type: max
        meta:
          group: 紀錄
          decimals: 0
          higherIsBetter: true
