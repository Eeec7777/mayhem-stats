cubes:
  - name: champions
    sql_table: dim_champions
    description: 英雄名稱與圖示,來自客戶端內建資源檔,會隨版本更新。

    # 與 participants.yml 相同的 refresh key,理由寫在那裡。SQL 必須一字不差才會被合併。
    refresh_key:
      sql: >
        SELECT (SELECT COALESCE(MAX(ingested_at), 0) FROM matches) || ':' || (SELECT COUNT(*) FROM dim_augments) || ':' || (SELECT group_concat(puuid || is_me || tracked) FROM accounts) || ':' || (SELECT COALESCE(MAX(version), 0) FROM mat_state)

    dimensions:
      - name: id
        sql: id
        type: number
        primary_key: true

      - name: name
        title: 英雄
        description: "英雄名稱。"
        sql: name
        type: string
        meta:
          group: 英雄

      - name: alias
        sql: alias
        type: string

      - name: icon_path
        sql: icon_path
        type: string

  # 名稱直接在 sql 裡先 join 好,而不是靠 Cube 的 join 去引用 dim_augments。
  # Cube 不允許成員的 SQL 引用其他 cube 的欄位,而且這樣也省掉一個中介 cube,
  # 前端可以直接查 augments.name。
  - name: augments
    sql: >
      SELECT pa.platform_id, pa.game_id, pa.participant_id, pa.slot, pa.augment_id,
             da.name AS augment_name, da.rarity AS augment_rarity, da.icon_path AS augment_icon
      FROM participant_augments pa
      LEFT JOIN dim_augments da ON da.id = pa.augment_id
    description: >
      長格式的增幅裝置(一列一個)。以此為維度查詢時同一場對局會展開成多列——
      這正是 participants 的場次指標必須用 count_distinct 的原因。

    # 與 participants.yml 相同的 refresh key,理由寫在那裡。SQL 必須一字不差才會被合併。
    refresh_key:
      sql: >
        SELECT (SELECT COALESCE(MAX(ingested_at), 0) FROM matches) || ':' || (SELECT COUNT(*) FROM dim_augments) || ':' || (SELECT group_concat(puuid || is_me || tracked) FROM accounts) || ':' || (SELECT COALESCE(MAX(version), 0) FROM mat_state)

    dimensions:
      - name: id
        sql: "{CUBE}.platform_id || ':' || {CUBE}.game_id || ':' || {CUBE}.participant_id || ':' || {CUBE}.slot"
        type: string
        primary_key: true

      - name: augment_id
        sql: augment_id
        type: number

      - name: slot
        sql: slot
        type: number

      - name: name
        title: 增幅裝置
        description: "增幅裝置名稱。以它分組時一場會出現在最多六個增幅底下，場次請用 count_distinct 的指標。"
        sql: augment_name
        type: string
        meta:
          group: 增幅

      - name: rarity
        title: 增幅稀有度
        description: "增幅稀有度代號：kBronze、kSilver、kGold、kPrismatic、kEventChoice。"
        sql: augment_rarity
        type: string
        meta:
          group: 增幅

      - name: icon_path
        sql: augment_icon
        type: string

  - name: items
    sql: >
      SELECT pi.platform_id, pi.game_id, pi.participant_id, pi.slot, pi.item_id,
             di.name AS item_name, di.icon_path AS item_icon
      FROM participant_items pi
      LEFT JOIN dim_items di ON di.id = pi.item_id
    description: 長格式的裝備(一列一件),同樣會造成對局展開。

    # 與 participants.yml 相同的 refresh key,理由寫在那裡。SQL 必須一字不差才會被合併。
    refresh_key:
      sql: >
        SELECT (SELECT COALESCE(MAX(ingested_at), 0) FROM matches) || ':' || (SELECT COUNT(*) FROM dim_augments) || ':' || (SELECT group_concat(puuid || is_me || tracked) FROM accounts) || ':' || (SELECT COALESCE(MAX(version), 0) FROM mat_state)

    dimensions:
      - name: id
        sql: "{CUBE}.platform_id || ':' || {CUBE}.game_id || ':' || {CUBE}.participant_id || ':' || {CUBE}.slot"
        type: string
        primary_key: true

      - name: item_id
        sql: item_id
        type: number

      - name: slot
        sql: slot
        type: number

      - name: name
        title: 裝備
        description: "裝備名稱（對局結束時身上的裝備）。以它分組時一場會展開成多列。"
        sql: item_name
        type: string
        meta:
          group: 裝備

      - name: icon_path
        sql: item_icon
        type: string

  # 一場對局裡的每一位參賽者，只拿來當「這場有誰」的篩選用。
  #
  # 為什麼需要它：「和某個帳號一起打的那些場」沒辦法寫成 participants 上的一個維度——
  # 條件的值是「同場那十個人」這個集合，不是單一值，而 Cube 的篩選是「成員 運算子 值」。
  # 做成一對多 join 之後它就只是一個等值篩選（game_players.puuid = 某人），
  # SQLite 可以先用 idx_mp_puuid_champ 找出那個人的每一場，再用 idx_mp_game 接回來。
  # 不要改用「把同場十個人串起來、再用 contains 比對」：那是 LIKE，每一列都要重算一次字串，
  # 而且 SQLite 方言在 Tesseract 規劃器下沒有對應的範本。
  #
  # ⚠ 一對多：一場有十列。以它的欄位「分組」時一場會展開成十列，場次類指標要 count_distinct、
  # 平均類指標會被重複計算（max 不受影響，所以紀錄榜可以安心用）。這個 cube 是設計來只出現在篩選裡的。
  - name: game_players
    title: 同場玩家（篩選用）
    sql_table: match_participants
    description: >
      一場對局裡的每一位參賽者（一場十列）。用途是篩出「某個帳號也在場的對局」：
      以 participants 為主，加上 game_players.puuid 等於某人，就只剩他參與的那些場。
      一對多 join，不要拿來當分組維度（一場會變成十列，平均類指標會被重複計算）。

    # 與 participants.yml 相同的 refresh key,理由寫在那裡。SQL 必須一字不差才會被合併。
    refresh_key:
      sql: >
        SELECT (SELECT COALESCE(MAX(ingested_at), 0) FROM matches) || ':' || (SELECT COUNT(*) FROM dim_augments) || ':' || (SELECT group_concat(puuid || is_me || tracked) FROM accounts) || ':' || (SELECT COALESCE(MAX(version), 0) FROM mat_state)

    dimensions:
      # 整數主鍵（來源表的 rowid）。字串串接的主鍵在「先撈主鍵再 join 回本表」那條路上用不到索引，
      # 理由與實測見 participants.yml 的 id。
      - name: id
        sql: "{CUBE}.rowid"
        type: number
        primary_key: true
        public: false

      - name: puuid
        title: 同場玩家 ID
        description: "這場對局裡某一位參賽者的 puuid。篩選用：等於某人 ＝ 只看他也在場的對局。"
        sql: puuid
        type: string

      - name: riot_id
        title: 同場玩家名稱（篩選用）
        description: "這場對局裡某一位參賽者的名稱。篩選用；拿來分組會讓一場變成十列，要看「和誰同場」的統計請改用 people_met（teammates）。"
        sql: riot_id
        type: string
