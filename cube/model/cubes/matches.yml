cubes:
  - name: matches
    # 重開局（matches.is_remake）不算：遊戲裡不算輸贏，但對局資料仍把一隊記為勝。原始資料保留在資料表裡
    sql: SELECT * FROM matches WHERE is_remake = 0
    description: 一場對局的表頭。時間欄位在資料庫裡是 epoch 毫秒(UTC),這裡轉成時間戳給 Cube,時區換算交由查詢端指定。

    # 與 participants.yml 相同的 refresh key,理由寫在那裡。SQL 必須一字不差才會被合併。
    refresh_key:
      sql: >
        SELECT (SELECT COALESCE(MAX(ingested_at), 0) FROM matches) || ':' || (SELECT COUNT(*) FROM dim_augments) || ':' || (SELECT group_concat(puuid || is_me || tracked) FROM accounts) || ':' || (SELECT COALESCE(MAX(version), 0) FROM mat_state)

    segments:
      - name: mayhem
        title: 只看 ARAM Mayhem
        description: 只算 ARAM Mayhem（queue_id = 2400）的對局，排除練習模式等其他模式。
        sql: "{CUBE}.queue_id = 2400"

    dimensions:
      - name: id
        sql: "{CUBE}.platform_id || ':' || {CUBE}.game_id"
        type: string
        primary_key: true

      - name: game_id
        sql: game_id
        type: number

      - name: queue_id
        title: 模式代號
        sql: queue_id
        type: number
        description: 2400 = ARAM Mayhem
        meta:
          group: 對局

      - name: game_mode
        title: 遊戲模式
        description: "客戶端回傳的遊戲模式代號，ARAM Mayhem 是 KIWI。篩選模式請用 queue_id。"
        sql: game_mode
        type: string
        meta:
          group: 對局

      - name: patch
        sql: "substr({CUBE}.game_version, 1, instr({CUBE}.game_version, '.') - 1) || '.' || substr(substr({CUBE}.game_version, instr({CUBE}.game_version, '.') + 1), 1, instr(substr({CUBE}.game_version, instr({CUBE}.game_version, '.') + 1), '.') - 1)"
        type: string
        title: 遊戲版本
        description: 只取主版號.次版號,例如 16.17
        meta:
          group: 時間

      - name: played_at
        title: 對局時間
        description: "開打時間（UTC 時間戳）。用日期區間篩選時，查詢要帶 \"timezone\": \"Asia/Taipei\"，否則區間邊界會差 8 小時。按天分組請改用 local_date。"
        # 格式必須是 ISO 的「T」：Cube 的區間篩選在 SQLite 上是拿這欄和 strftime('%Y-%m-%dT%H:%M:%f', ?) 比字串。
        # 原本用 datetime() 產生「2026-10-02 16:06:53」，空格排在 T 前面，起始日那個 UTC 日期的場次
        # （台北凌晨 0～8 點）整天被排除、結束日之後的凌晨反而被算進來（2026-10-10 實測 10/3～10/9 少 4 場）。
        sql: "strftime('%Y-%m-%dT%H:%M:%f', {CUBE}.game_creation / 1000.0, 'unixepoch')"
        type: time
        meta:
          group: 時間

      # 「幾點」「星期幾」是從時間戳抽取出來的，不是 Cube 的時間粒度，所以另外定義。
      # 型別刻意用字串:這些是運算式、沒有欄位型別親和性,而 Cube 會把篩選值綁成
      # 字串,若宣告成數字,SQLite 不會把 '15' 轉成 15,篩選會永遠比對不到。
      # 這裡的 localtime 取本機時區——這個工具本來就跑在使用者自己的電腦上。
      # 這三個是採集時就用 Python 算好存進資料庫的本地時間。
      # 不要改回 strftime(..., 'localtime'):Cube 的 server 行程跑在 UTC 下,
      # 那個 'localtime' 等於 UTC,整頁時段分析會偏移 8 小時。
      # (實測過:畫面說「最常打 週日 07:00」,實際是週日 15:00。)
      - name: hour_of_day
        title: 時段
        description: "開打當下的本地小時（0-23）。"
        sql: local_hour
        type: number
        meta:
          group: 時間

      - name: weekday
        title: 星期
        sql: local_weekday
        type: number
        description: 0 = 週日
        meta:
          group: 時間

      - name: local_date
        title: 日期
        sql: local_date
        type: string
        description: 開打當下的本地日期(YYYY-MM-DD)
        meta:
          group: 時間

      - name: duration_minutes
        sql: "{CUBE}.game_duration / 60.0"
        type: number

      - name: duration_bucket
        title: 對局長度
        description: "對局長度分組（遊戲內時鐘 mm:ss）：< 8:00（重開）、8:00-13:40、13:40-15:40、15:40-17:10、17:10-18:40、18:40-21:00、21:00 以上。界線有依據：8:00 是最早能投降的時間，之前的對局是重開或斷線，不是正常對局；13:40 是統計上唯一站得住腳的勝率轉折（13:40 以前約 68%、以後約 46%）；其餘各段依場數等分（約各 1/6），邊界只看長度、不看勝負。方法與數字見 docs/duration-bucketing.md。"
        meta:
          group: 對局
        sql: >
          CASE WHEN {CUBE}.game_duration < 480 THEN '< 8:00（重開）'
               WHEN {CUBE}.game_duration < 820 THEN '8:00-13:40'
               WHEN {CUBE}.game_duration < 940 THEN '13:40-15:40'
               WHEN {CUBE}.game_duration < 1030 THEN '15:40-17:10'
               WHEN {CUBE}.game_duration < 1120 THEN '17:10-18:40'
               WHEN {CUBE}.game_duration < 1260 THEN '18:40-21:00'
               ELSE '21:00 以上' END
        type: string

      - name: ended_surrender
        sql: ended_surrender
        type: number

      - name: end_type
        title: 結束方式
        description: "對局結束方式：投降或正常結束。來源是採集到的 ended_surrender 旗標。"
        sql: "CASE WHEN {CUBE}.ended_surrender = 1 THEN '投降' ELSE '正常結束' END"
        type: string
        meta:
          group: 對局

      - name: time_block
        title: 時段區塊
        description: "依本地開打小時分成凌晨、早上、下午、晚上；使用採集時保存的本地小時。"
        sql: >
          CASE WHEN {CUBE}.local_hour < 6 THEN '凌晨'
               WHEN {CUBE}.local_hour < 12 THEN '早上'
               WHEN {CUBE}.local_hour < 18 THEN '下午'
               ELSE '晚上' END
        type: string
        meta:
          group: 時間

      - name: is_weekend
        title: 平日或週末
        description: "依本地星期分成平日或週末；週日與週六算週末。"
        sql: "CASE WHEN {CUBE}.local_weekday IN (0, 6) THEN '週末' ELSE '平日' END"
        type: string
        meta:
          group: 時間

    measures:
      # 對局數（每場一次）。版本選單用它算「這個版本打了幾場」；玩家對局數請用 participants.games
      - name: count
        title: 對局數
        type: count
        meta: { group: 對局 }

      - name: avg_duration
        title: 平均對局時長
        description: "平均對局長度（分鐘）。"
        sql: "{CUBE}.game_duration / 60.0"
        type: avg
        meta:
          group: 對局
          unit: 分
          decimals: 1
