cubes:
  # 同場其他玩家的自我 join。Riot 的 API 不提供「誰跟誰一起排隊」的欄位,
  # 但同隊次數本身就能看出固定車隊。
  #
  # 每一列的語意是「某人的某一場 × 同場的另一個人」。查詢時務必用
  # subject_puuid 指定要以誰為視角,否則會把所有人的視角混在一起。
  - name: teammates
    # 重開局不算：下面 JOIN matches rm … is_remake = 0。注意 sql 是折疊區塊（>），換行會被接成一行，裡面不能寫 SQL 的 -- 註解
    sql: >
      SELECT me.rowid * 16 + other.participant_id AS row_key,
             me.rowid AS subject_rowid,
             me.platform_id, me.game_id, me.participant_id, me.win,
             me.champion_id AS subject_champion_id,
             me.puuid      AS subject_puuid,
             other.puuid   AS other_puuid,
             other.riot_id AS other_riot_id,
             mine_champ.name  AS subject_champion,
             mine_champ.icon_path AS subject_champion_icon,
             other_champ.name AS other_champion,
             other_champ.icon_path AS other_champion_icon,
             CASE WHEN other.team_id = me.team_id THEN 'teammate' ELSE 'opponent' END AS relation
      FROM match_participants me
      JOIN match_participants other
        ON other.platform_id = me.platform_id
       AND other.game_id     = me.game_id
       AND other.puuid      <> me.puuid
      JOIN matches rm
        ON rm.platform_id = me.platform_id AND rm.game_id = me.game_id AND rm.is_remake = 0
      LEFT JOIN dim_champions mine_champ  ON mine_champ.id  = me.champion_id
      LEFT JOIN dim_champions other_champ ON other_champ.id = other.champion_id

    # 與 participants.yml 相同的 refresh key,理由寫在那裡。SQL 必須一字不差才會被合併。
    refresh_key:
      sql: >
        SELECT (SELECT COALESCE(MAX(ingested_at), 0) FROM matches) || ':' || (SELECT COUNT(*) FROM dim_augments) || ':' || (SELECT group_concat(puuid || is_me || tracked) FROM accounts) || ':' || (SELECT COALESCE(MAX(version), 0) FROM mat_state)

    joins:
      - name: champion_roles
        sql: "{CUBE}.subject_champion_id = {champion_roles}.champion_id"
        relationship: one_to_many

      # 「我這一場」的出裝定位：隊友／對手頁的「我玩哪類比較會贏」用它，和其他頁的定位一致
      - name: builds
        sql: "{CUBE}.subject_rowid = {builds}.participant_rowid"
        relationship: many_to_one

      - name: matches
        sql: "{CUBE}.platform_id = {matches}.platform_id AND {CUBE}.game_id = {matches}.game_id"
        relationship: many_to_one

    segments:
      - name: mine
        title: 以本機帳號為視角
        description: 只看本機帳號（accounts.is_me = 1）和同場其他人的關係。不加的話所有帳號的視角會混在一起。
        sql: "{CUBE}.subject_puuid IN (SELECT puuid FROM accounts WHERE is_me = 1)"

    # 以「人」為主的下鑽路徑，說明同 participants.yml 的 hierarchies。
    # 這個 cube 和 participants 沒有 join 路徑，所以路徑裡只能放這裡與 matches 的維度。
    #
    # 「隊友或對手」不要放第一層：每一場都同時有隊友和對手，兩列的場次與勝率一模一樣，
    # 點哪個都看不出東西。先挑人或英雄，再拆「同隊時 / 對上時」才有差別。
    hierarchies:
      - name: people
        title: 和誰一起打
        levels:
          - teammates.player
          - teammates.relation
          - teammates.my_champion

      - name: champion_people
        title: 這隻英雄和誰一起
        levels:
          - teammates.my_champion
          - teammates.player
          - teammates.relation

      - name: matchup
        title: 遇到哪隻英雄
        levels:
          - teammates.other_champion
          - teammates.relation
          - teammates.my_champion

    dimensions:
      # 整數主鍵。「我這一列」的 rowid 決定了是誰的哪一場，再加上對方的
      # participant_id（1～10，小於 16）就唯一。
      #
      # 不能用字串串接：一對多 join（例如英雄定位）時 Cube 會先撈主鍵再 join 回
      # 這張自我 join 的衍生表，字串運算式用不到索引，等於「所有人 × 所有同場者」
      # 逐列比字串。實測定位拆解 530ms -> 14ms，而且原本會隨資料量平方成長。
      - name: id
        sql: "{CUBE}.row_key"
        type: number
        primary_key: true

      - name: subject_puuid
        sql: subject_puuid
        type: string
        description: 以誰的視角看。不指定的話所有人的視角會混在一起。

      - name: player
        title: 同場玩家
        description: "同場另一位玩家的名稱（Riot ID）。"
        sql: other_riot_id
        type: string
        meta:
          group: 玩家

      - name: puuid
        sql: other_puuid
        type: string

      # 兩邊的英雄都放進來，才能問「和這個人一起時，我用哪隻比較會贏」。
      # 注意樣本：和最常同隊的人 95 場，卻攤在 57 個英雄上，多數只有 1 場。
      - name: my_champion
        title: 我的英雄
        description: "視角玩家（subject_puuid）在那一場用的英雄。"
        sql: subject_champion
        type: string
        meta:
          group: 玩家

      - name: my_champion_icon
        sql: subject_champion_icon
        type: string

      - name: other_champion
        title: 對方的英雄
        description: "同場那位玩家在那一場用的英雄。"
        sql: other_champion
        type: string
        meta:
          group: 玩家

      - name: other_champion_icon
        sql: other_champion_icon
        type: string

      - name: relation
        title: 隊友或對手
        sql: relation
        type: string
        meta:
          group: 玩家
        description: teammate = 與我同隊,opponent = 我的對手

    measures:
      - name: games
        title: 同場次數
        sql: "{CUBE}.platform_id || ':' || {CUBE}.game_id"
        type: count_distinct
        description: 與這個人同場的對局數
        meta:
          group: 玩家
          decimals: 0

      - name: wins
        title: 同場勝場
        sql: "CASE WHEN {CUBE}.win = 1 THEN {CUBE}.platform_id || ':' || {CUBE}.game_id END"
        type: count_distinct
        description: 其中我方獲勝的場次
        meta:
          group: 玩家
          decimals: 0

      - name: winrate
        title: 同場勝率
        sql: "100.0 * {wins} / NULLIF({games}, 0)"
        type: number
        format: percent
        description: 和這個人同隊(或對上這個人)時,我的勝率
        meta:
          group: 玩家
          unit: "%"
          decimals: 1

      # 本地日期（採集時存好的 local_date），不是在 Cube 裡換算時區。MAX 不受一對多 join 重複影響。
      - name: last_played
        title: 最近同場
        sql: "MAX({matches.local_date})"
        type: string
        description: 最近一次和這個人同場的本地日期（YYYY-MM-DD）
        meta:
          group: 玩家
