cubes:
  # 對局序列，帶上「前一場的結果」與「當日第幾場」。查詢時用 puuid 指定對象。
  #
  # 這兩個要靠視窗函數，而 Cube 的 measure/dimension 沒辦法表達 LAG，
  # 所以在 sql: 裡先算好。SQLite 支援 LAG 與 ROW_NUMBER。
  #
  # 「當日」用採集時存好的 m.local_date，不能用 date(..., 'localtime')：Cube 行程跑在 UTC，
  # 那個 localtime 等於 UTC，一天從台灣早上 8 點才開始算（實測 143 場裡 47 場的當日第幾場算錯）。
  #
  # 視窗函數以 puuid 分區，否則不同玩家的對局會混在一起算「前一場」。
  # 同時以 queue_id 分區：畫面通常篩到只看 Mayhem，若跨模式取前一場，
  # 「前一場」會指到畫面上根本看不到的對局。
  - name: my_games
    sql: >
      SELECT
        mp.platform_id, mp.game_id, mp.puuid, mp.riot_id, mp.win, mp.champion_id,
        m.queue_id, m.game_creation, m.game_duration,
        LAG(mp.win) OVER (
          PARTITION BY mp.puuid, m.queue_id ORDER BY m.game_creation
        ) AS prev_win,
        ROW_NUMBER() OVER (
          PARTITION BY mp.puuid, m.queue_id, m.local_date
          ORDER BY m.game_creation
        ) AS game_of_day
      FROM match_participants mp
      JOIN matches m
        ON m.platform_id = mp.platform_id AND m.game_id = mp.game_id AND m.is_remake = 0

    # 與 participants.yml 相同的 refresh key,理由寫在那裡。SQL 必須一字不差才會被合併。
    refresh_key:
      sql: >
        SELECT (SELECT COALESCE(MAX(ingested_at), 0) FROM matches) || ':' || (SELECT COUNT(*) FROM dim_augments) || ':' || (SELECT group_concat(puuid || is_me || tracked) FROM accounts) || ':' || (SELECT COALESCE(MAX(version), 0) FROM mat_state)

    segments:
      - name: mine
        title: 只看本機帳號
        description: 只算本機帳號（accounts.is_me = 1）的對局序列。
        sql: "{CUBE}.puuid IN (SELECT puuid FROM accounts WHERE is_me = 1)"

      - name: mayhem
        title: 只看 ARAM Mayhem
        description: 只算 ARAM Mayhem（queue_id = 2400）。前一場與當日第幾場本來就在同一模式內計算。
        sql: "{CUBE}.queue_id = 2400"

    dimensions:
      - name: id
        sql: "{CUBE}.platform_id || ':' || {CUBE}.game_id || ':' || {CUBE}.puuid"
        type: string
        primary_key: true

      - name: puuid
        sql: puuid
        type: string

      - name: player
        sql: riot_id
        type: string
        public: false

      - name: queue_id
        sql: queue_id
        type: number

      # 下鑽用：節奏頁的分組條件交給 Cube 查出是哪幾場，再送 /api/matches 列出來。
      # 後端因此不需要自己再抄一份「前一場」「當日第幾場」的視窗函數。
      - name: game_id
        sql: game_id
        type: number

      - name: played_at
        sql: "strftime('%Y-%m-%dT%H:%M:%f', {CUBE}.game_creation / 1000.0, 'unixepoch')"
        type: time

      # 字串型別是刻意的：這是運算式、沒有欄位型別親和性，
      # 而 Cube 會把篩選值綁成字串，宣告成數字的話比較永遠不成立。
      - name: prev_result
        title: 前一場結果
        description: "同一玩家、同一模式裡的前一場結果：前一場贏 / 前一場輸 / 沒有前一場。"
        meta:
          group: 節奏
        sql: >
          CASE WHEN {CUBE}.prev_win IS NULL THEN '沒有前一場'
               WHEN {CUBE}.prev_win = 1 THEN '前一場贏'
               ELSE '前一場輸' END
        type: string

      - name: game_of_day
        title: 當日第幾場
        sql: "CAST({CUBE}.game_of_day AS TEXT)"
        type: string
        meta:
          group: 節奏
        description: 當天的第幾場（同一模式內計算）

      - name: session_stage
        title: 當日階段
        meta:
          group: 節奏
        sql: >
          CASE WHEN {CUBE}.game_of_day <= 2 THEN '第 1-2 場'
               WHEN {CUBE}.game_of_day <= 5 THEN '第 3-5 場'
               WHEN {CUBE}.game_of_day <= 9 THEN '第 6-9 場'
               ELSE '第 10 場以後' END
        type: string
        description: 用來看一天打越久是不是表現越差

      - name: result
        sql: "CASE WHEN {CUBE}.win = 1 THEN '勝' ELSE '敗' END"
        type: string
        public: false

    measures:
      - name: games
        title: 場次
        description: "對局數。"
        sql: "{CUBE}.platform_id || ':' || {CUBE}.game_id"
        type: count_distinct
        meta:
          group: 節奏
          decimals: 0

      - name: wins
        title: 勝場
        description: "獲勝的對局數。"
        sql: "CASE WHEN {CUBE}.win = 1 THEN {CUBE}.platform_id || ':' || {CUBE}.game_id END"
        type: count_distinct
        meta:
          group: 節奏
          decimals: 0

      - name: winrate
        title: 勝率
        description: "勝場 ÷ 場次 × 100（%）。"
        sql: "100.0 * {wins} / NULLIF({games}, 0)"
        type: number
        format: percent
        meta:
          group: 節奏
          unit: "%"
          decimals: 1

      - name: avg_duration
        title: 平均時長
        description: "平均對局長度（分鐘）。"
        sql: "{CUBE}.game_duration / 60.0"
        type: avg
        meta:
          group: 節奏
          unit: 分
          decimals: 1
