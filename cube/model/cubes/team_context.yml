cubes:
  # 每隊每場一列。這個 grain 讓個人列可以安全地帶出「我方隊伍」與「敵方隊伍」
  # 的聚合結果，不需要在每個查詢裡重組五位隊友。
  - name: team_context
    title: 隊伍情境
    sql: >
      WITH team_agg AS (
        SELECT
          mp.platform_id,
          mp.game_id,
          mp.team_id,
          MIN(mp.rowid) AS team_rowid,
          MAX(mp.win) AS team_win,
          COUNT(*) AS team_players,
          SUM(mp.kills) AS team_kills,
          SUM(mp.deaths) AS team_deaths,
          SUM(mp.assists) AS team_assists,
          SUM(mp.dmg_to_champions) AS team_dmg,
          SUM(mp.dmg_taken) AS team_dmg_taken,
          SUM(mp.gold_earned) AS team_gold,
          SUM(mp.gold_spent) AS team_gold_spent,
          SUM(mp.time_ccing_others) AS team_cc,
          SUM(mp.turret_kills) AS team_turret_kills,
          SUM(mp.dmg_to_objectives) AS team_objective_dmg
        FROM match_participants mp
        GROUP BY mp.platform_id, mp.game_id, mp.team_id
      ), team_rows AS (
        SELECT
          ta.*,
          e.team_kills AS enemy_kills,
          e.team_deaths AS enemy_deaths,
          e.team_assists AS enemy_assists,
          e.team_dmg AS enemy_dmg,
          e.team_dmg_taken AS enemy_dmg_taken,
          e.team_gold AS enemy_gold,
          e.team_gold_spent AS enemy_gold_spent,
          e.team_cc AS enemy_cc,
          e.team_turret_kills AS enemy_turret_kills,
          e.team_objective_dmg AS enemy_objective_dmg,
          m.queue_id,
          m.game_creation,
          m.game_duration,
          m.local_date,
          m.local_weekday,
          m.local_hour,
          m.game_version,
          m.ended_surrender,
          CASE WHEN ta.team_id = 100 THEN '藍隊' ELSE '紅隊' END AS side,
          COALESCE(mt.first_blood, 0) AS first_blood,
          COALESCE(mt.first_tower, 0) AS first_tower,
          COALESCE(mt.first_inhibitor, 0) AS first_inhibitor,
          COALESCE(mt.tower_kills, 0) AS tower_kills,
          COALESCE(mt.inhibitor_kills, 0) AS inhibitor_kills
        FROM team_agg ta
        JOIN team_agg e
          ON e.platform_id = ta.platform_id
         AND e.game_id = ta.game_id
         AND e.team_id <> ta.team_id
        JOIN matches m
          ON m.platform_id = ta.platform_id AND m.game_id = ta.game_id AND m.is_remake = 0
        -- 寫入時從原始 JSON 的 teams 拆好的（db.match_teams），不在查詢時解析 raw_json
        LEFT JOIN match_teams mt
          ON mt.platform_id = ta.platform_id AND mt.game_id = ta.game_id AND mt.team_id = ta.team_id
      )
      SELECT * FROM team_rows

    description: >
      每場每隊一列的隊伍情境。team_* 是我方隊伍合計，enemy_* 是同場另一隊合計；
      first_blood、first_tower、first_inhibitor、tower_kills、inhibitor_kills 來自原始 teams JSON（入庫時拆進 match_teams）。
      透過 participants.team_context join 後，可在同一查詢裡比較個人輸出與隊伍差距。

    refresh_key:
      sql: >
        SELECT (SELECT COALESCE(MAX(ingested_at), 0) FROM matches) || ':' || (SELECT COUNT(*) FROM dim_augments) || ':' || (SELECT group_concat(puuid || is_me || tracked) FROM accounts) || ':' || (SELECT COALESCE(MAX(version), 0) FROM mat_state)

    segments:
      - name: mine
        title: 只看本機帳號所在隊伍
        description: 只算本機帳號所在的隊伍。
        sql: >
          {CUBE}.team_rowid IN (
            SELECT t.team_rowid
            FROM (
              SELECT mp.platform_id, mp.game_id, mp.team_id, MIN(mp.rowid) AS team_rowid
              FROM match_participants mp
              GROUP BY mp.platform_id, mp.game_id, mp.team_id
            ) t
            WHERE EXISTS (
              SELECT 1
              FROM match_participants me
              WHERE me.platform_id = t.platform_id
                AND me.game_id = t.game_id
                AND me.team_id = t.team_id
                AND me.puuid IN (SELECT puuid FROM accounts WHERE is_me = 1)
            )
          )

      - name: mayhem
        title: 只看 ARAM Mayhem
        description: 只算 ARAM Mayhem（queue_id = 2400）。
        sql: "{CUBE}.queue_id = 2400"

    dimensions:
      - name: id
        sql: team_rowid
        type: number
        primary_key: true
        public: false

      - name: team_rowid
        sql: team_rowid
        type: number
        public: false

      - name: platform_id
        sql: platform_id
        type: string
        public: false

      - name: game_id
        sql: game_id
        type: number
        public: false

      - name: team_id
        sql: team_id
        type: number
        public: false

      - name: queue_id
        title: 模式代號
        sql: queue_id
        type: number
        public: false

      - name: local_date
        title: 日期
        sql: local_date
        type: string
        meta: { group: 時間 }

      - name: side
        title: 隊伍
        sql: side
        type: string
        meta: { group: 隊伍 }

      - name: result
        title: 勝負
        sql: "CASE WHEN {CUBE}.team_win = 1 THEN '勝' ELSE '敗' END"
        type: string
        meta: { group: 隊伍 }

      - name: duration_bucket
        title: 對局長度
        sql: >
          CASE WHEN {CUBE}.game_duration < 480 THEN '< 8:00（重開）'
               WHEN {CUBE}.game_duration < 820 THEN '8:00-13:40'
               WHEN {CUBE}.game_duration < 940 THEN '13:40-15:40'
               WHEN {CUBE}.game_duration < 1030 THEN '15:40-17:10'
               WHEN {CUBE}.game_duration < 1120 THEN '17:10-18:40'
               WHEN {CUBE}.game_duration < 1260 THEN '18:40-21:00'
               ELSE '21:00 以上' END
        type: string
        meta: { group: 對局 }

      - name: first_blood
        title: 首殺隊伍
        sql: "CASE WHEN {CUBE}.first_blood = 1 THEN '首殺' ELSE '沒有首殺' END"
        type: string
        meta: { group: 目標 }

      - name: first_tower
        title: 首塔隊伍
        sql: "CASE WHEN {CUBE}.first_tower = 1 THEN '首塔' ELSE '沒有首塔' END"
        type: string
        meta: { group: 目標 }

      - name: first_inhibitor
        title: 首破兵營隊伍
        sql: "CASE WHEN {CUBE}.first_inhibitor = 1 THEN '首破兵營' ELSE '沒有首破兵營' END"
        type: string
        meta: { group: 目標 }

    measures:
      - name: games
        title: 隊伍對局數
        sql: team_rowid
        type: count_distinct
        meta: { group: 基本, decimals: 0 }

      - name: wins
        title: 隊伍勝場
        sql: "CASE WHEN {CUBE}.team_win = 1 THEN {CUBE}.team_rowid END"
        type: count_distinct
        meta: { group: 基本, decimals: 0 }

      - name: winrate
        title: 隊伍勝率
        sql: "100.0 * {wins} / NULLIF({games}, 0)"
        type: number
        format: percent
        meta: { group: 基本, unit: "%", decimals: 1 }

      - name: avg_team_kills
        title: 平均隊伍擊殺
        sql: team_kills
        type: avg
        meta: { group: 隊伍, decimals: 1 }

      - name: avg_enemy_kills
        title: 平均敵方擊殺
        sql: enemy_kills
        type: avg
        meta: { group: 隊伍, decimals: 1 }

      - name: kill_gap
        title: 平均擊殺差
        sql: "team_kills - enemy_kills"
        type: avg
        meta: { group: 隊伍, decimals: 1, higherIsBetter: true }

      - name: avg_team_dmg
        title: 平均隊伍傷害
        sql: team_dmg
        type: avg
        meta: { group: 輸出, decimals: 0 }

      - name: avg_enemy_dmg
        title: 平均敵方傷害
        sql: enemy_dmg
        type: avg
        meta: { group: 輸出, decimals: 0 }

      - name: dmg_gap
        title: 平均傷害差
        sql: "team_dmg - enemy_dmg"
        type: avg
        meta: { group: 輸出, decimals: 0, higherIsBetter: true }

      - name: team_dpm
        title: 隊伍每分鐘傷害
        sql: "team_dmg * 60.0 / NULLIF(game_duration, 0)"
        type: avg
        meta: { group: 輸出, unit: 每分鐘, decimals: 0, higherIsBetter: true }

      - name: enemy_dpm
        title: 敵方每分鐘傷害
        sql: "enemy_dmg * 60.0 / NULLIF(game_duration, 0)"
        type: avg
        meta: { group: 輸出, unit: 每分鐘, decimals: 0 }

      - name: dpm_gap
        title: 每分鐘傷害差
        sql: "(team_dmg - enemy_dmg) * 60.0 / NULLIF(game_duration, 0)"
        type: avg
        meta: { group: 輸出, unit: 每分鐘, decimals: 0, higherIsBetter: true }

      - name: avg_team_gold
        title: 平均隊伍經濟
        sql: team_gold
        type: avg
        meta: { group: 經濟, decimals: 0 }

      - name: avg_enemy_gold
        title: 平均敵方經濟
        sql: enemy_gold
        type: avg
        meta: { group: 經濟, decimals: 0 }

      - name: gold_gap
        title: 平均經濟差
        sql: "team_gold - enemy_gold"
        type: avg
        meta: { group: 經濟, decimals: 0, higherIsBetter: true }

      - name: team_gpm
        title: 隊伍每分鐘經濟
        sql: "team_gold * 60.0 / NULLIF(game_duration, 0)"
        type: avg
        meta: { group: 經濟, unit: 每分鐘, decimals: 0 }

      - name: enemy_gpm
        title: 敵方每分鐘經濟
        sql: "enemy_gold * 60.0 / NULLIF(game_duration, 0)"
        type: avg
        meta: { group: 經濟, unit: 每分鐘, decimals: 0 }

      - name: gpm_gap
        title: 每分鐘經濟差
        sql: "(team_gold - enemy_gold) * 60.0 / NULLIF(game_duration, 0)"
        type: avg
        meta: { group: 經濟, unit: 每分鐘, decimals: 0, higherIsBetter: true }

      - name: avg_tower_kills
        title: 平均防禦塔擊破
        sql: tower_kills
        type: avg
        meta: { group: 目標, decimals: 1 }

      - name: avg_inhibitor_kills
        title: 平均兵營擊破
        sql: inhibitor_kills
        type: avg
        meta: { group: 目標, decimals: 1 }

      - name: first_blood_rate
        title: 首殺率
        sql: "100.0 * AVG(first_blood)"
        type: number
        format: percent
        meta: { group: 目標, unit: "%", decimals: 1 }

      - name: first_tower_rate
        title: 首塔率
        sql: "100.0 * AVG(first_tower)"
        type: number
        format: percent
        meta: { group: 目標, unit: "%", decimals: 1 }

      - name: first_inhibitor_rate
        title: 首破兵營率
        sql: "100.0 * AVG(first_inhibitor)"
        type: number
        format: percent
        meta: { group: 目標, unit: "%", decimals: 1 }
