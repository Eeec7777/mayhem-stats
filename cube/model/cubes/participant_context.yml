cubes:
  # 每位玩家每場一列，補上需要完整歷史排序才能得到的遊玩情境。
  # 這張 SQL cube 以 match_participants.rowid 對回 participants，
  # 因此可以在同一個查詢中把情境維度和個人 DPM、KDA 等 measures 放在一起。
  # session 的規則是可調的分析假設：前一場結束後休息超過 60 分鐘就開新 session。
  - name: participant_context
    title: 玩家遊玩情境
    # 規則本體在 meta.materialize.sql。每次入庫後由 features.py 照它重建 mat_participant_context，這裡直接讀表：
    # 對全部參賽者跑視窗函數的成本每個查詢都要付一次，資料十倍時一個查詢要十幾秒（實測）。
    # 改規則只改這裡；改完重啟服務或跑 `uv run features.py` 才會重建。
    sql_table: mat_participant_context
    meta:
      materialize:
        table: mat_participant_context
        sql: >
          WITH ordered AS (
            SELECT
              mp.rowid AS participant_rowid,
              mp.platform_id,
              mp.game_id,
              mp.participant_id,
              mp.puuid,
              mp.win,
              m.queue_id,
              m.game_creation,
              m.game_duration,
              m.local_date,
              LAG(mp.win) OVER (
                PARTITION BY mp.puuid, m.queue_id
                ORDER BY m.game_creation, m.platform_id, m.game_id
              ) AS prev_win,
              LAG(m.game_creation) OVER (
                PARTITION BY mp.puuid, m.queue_id
                ORDER BY m.game_creation, m.platform_id, m.game_id
              ) AS prev_creation,
              LAG(m.game_duration) OVER (
                PARTITION BY mp.puuid, m.queue_id
                ORDER BY m.game_creation, m.platform_id, m.game_id
              ) AS prev_duration
            FROM match_participants mp
            JOIN matches m
              ON m.platform_id = mp.platform_id AND m.game_id = mp.game_id AND m.is_remake = 0
          ), marked AS (
            SELECT *,
              CASE
                WHEN prev_creation IS NULL THEN 1
                WHEN game_creation > prev_creation + COALESCE(prev_duration, 0) * 1000 + 3600000 THEN 1
                ELSE 0
              END AS starts_session
            FROM ordered
          ), sessioned AS (
            SELECT *,
              SUM(starts_session) OVER (
                PARTITION BY puuid, queue_id
                ORDER BY game_creation, platform_id, game_id
                ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
              ) AS session_id
            FROM marked
          ), ranked AS (
            SELECT *,
              ROW_NUMBER() OVER (
                PARTITION BY puuid, queue_id, session_id
                ORDER BY game_creation, platform_id, game_id
              ) AS game_in_session,
              COALESCE(SUM(game_duration) OVER (
                PARTITION BY puuid, queue_id, session_id
                ORDER BY game_creation, platform_id, game_id
                ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING
              ), 0) / 60.0 AS minutes_before
            FROM sessioned
          )
          SELECT
            participant_rowid,
            platform_id,
            game_id,
            participant_id,
            puuid,
            win,
            queue_id,
            game_creation,
            game_duration,
            local_date,
            prev_win,
            CASE
              WHEN prev_creation IS NULL THEN NULL
              ELSE (game_creation - prev_creation - COALESCE(prev_duration, 0) * 1000) / 60000.0
            END AS break_minutes_before,
            session_id,
            game_in_session,
            minutes_before
          FROM ranked

    description: >
      玩家每場對局的序列情境。依玩家與模式排序；前一場結果與休息時間使用完整已收錄歷史計算，
      不會因查詢日期篩選而重新編號。休息超過 60 分鐘視為新 session；這是分析規則，不是遊戲提供的欄位。

    refresh_key:
      sql: >
        SELECT (SELECT COALESCE(MAX(ingested_at), 0) FROM matches) || ':' || (SELECT COUNT(*) FROM dim_augments) || ':' || (SELECT group_concat(puuid || is_me || tracked) FROM accounts) || ':' || (SELECT COALESCE(MAX(version), 0) FROM mat_state)

    segments:
      - name: mine
        title: 只看本機帳號
        description: 只算本機帳號的遊玩序列。
        sql: "{CUBE}.puuid IN (SELECT puuid FROM accounts WHERE is_me = 1)"

      - name: mayhem
        title: 只看 ARAM Mayhem
        description: 只算 ARAM Mayhem（queue_id = 2400）。
        sql: "{CUBE}.queue_id = 2400"

    dimensions:
      - name: id
        sql: participant_rowid
        type: number
        primary_key: true
        public: false

      - name: participant_rowid
        sql: participant_rowid
        type: number
        public: false

      - name: puuid
        sql: puuid
        type: string
        public: false

      - name: queue_id
        sql: queue_id
        type: number
        public: false

      - name: played_at
        title: 對局時間
        sql: "strftime('%Y-%m-%dT%H:%M:%f', {CUBE}.game_creation / 1000.0, 'unixepoch')"
        type: time
        public: false

      - name: local_date
        title: 日期
        sql: local_date
        type: string
        public: false

      - name: prev_result
        title: 前一場結果
        description: "同一玩家、同一模式裡的前一場結果；第一場沒有前一場。"
        sql: >
          CASE WHEN {CUBE}.prev_win IS NULL THEN '沒有前一場'
               WHEN {CUBE}.prev_win = 1 THEN '前一場贏'
               ELSE '前一場輸' END
        type: string
        meta:
          group: 節奏

      - name: break_minutes_before
        title: 前場結束後休息分鐘
        description: "本場開打時間減去前場結束時間；第一場為空。"
        sql: break_minutes_before
        type: number
        meta:
          group: 節奏
          unit: 分
          decimals: 1

      - name: break_bucket
        title: 前場後休息區間
        description: "依前場結束後到本場開打的分鐘數分組；超過 60 分鐘同時會開新 session。"
        sql: >
          CASE WHEN {CUBE}.break_minutes_before IS NULL THEN '沒有前一場'
               WHEN {CUBE}.break_minutes_before < 30 THEN '< 30 分'
               WHEN {CUBE}.break_minutes_before < 60 THEN '30-60 分'
               WHEN {CUBE}.break_minutes_before < 120 THEN '60-120 分'
               ELSE '120 分以上' END
        type: string
        meta:
          group: 節奏

      - name: session_id
        title: Session 編號
        sql: session_id
        type: number
        public: false

      - name: game_in_session
        title: Session 內第幾場
        sql: "CAST({CUBE}.game_in_session AS TEXT)"
        type: string
        meta:
          group: 節奏

      - name: session_stage
        title: Session 階段
        description: "同一 session 內的對局階段。"
        sql: >
          CASE WHEN {CUBE}.game_in_session <= 2 THEN '第 1-2 場'
               WHEN {CUBE}.game_in_session <= 5 THEN '第 3-5 場'
               WHEN {CUBE}.game_in_session <= 9 THEN '第 6-9 場'
               ELSE '第 10 場以後' END
        type: string
        meta:
          group: 節奏

      - name: minutes_before
        title: Session 前累積分鐘
        description: "同一 session 內，本場開始前已完成的對局分鐘數；不含休息與本場。"
        sql: minutes_before
        type: number
        meta:
          group: 節奏
          unit: 分
          decimals: 1

    measures:
      - name: games
        title: 玩家對局數
        sql: participant_rowid
        type: count_distinct
        meta: { group: 節奏, decimals: 0 }

      - name: wins
        title: 勝場
        sql: "CASE WHEN {CUBE}.win = 1 THEN {CUBE}.participant_rowid END"
        type: count_distinct
        meta: { group: 節奏, decimals: 0 }

      - name: losses
        title: 敗場
        sql: "CASE WHEN {CUBE}.win = 0 THEN {CUBE}.participant_rowid END"
        type: count_distinct
        meta: { group: 節奏, decimals: 0 }

      - name: winrate
        title: 勝率
        sql: "100.0 * {wins} / NULLIF({games}, 0)"
        type: number
        format: percent
        meta: { group: 節奏, unit: "%", decimals: 1 }

      - name: avg_duration
        title: 平均對局時長
        sql: "{CUBE}.game_duration / 60.0"
        type: avg
        meta: { group: 節奏, unit: 分, decimals: 1 }

      - name: avg_break_minutes
        title: 平均休息分鐘
        sql: break_minutes_before
        type: avg
        meta: { group: 節奏, unit: 分, decimals: 1 }

      - name: avg_minutes_before
        title: 平均 Session 前累積分鐘
        sql: minutes_before
        type: avg
        meta: { group: 節奏, unit: 分, decimals: 1 }
